<style>
/* Layout: the family notebook as a small website — ruled sheets on a desk, one column, tab bar pinned at the bottom for thumbs. */
:root {
  --desk: #e4e8ee; --paper: #fdfefe; --ink: #18202e; --muted: #5b6678; --rule: #c9d8ea;
  --margin: #e08a8a; --hl: #fff27a; --pen: #1f3f9c; --on-pen: #ffffff; --chip: #eef2f8; --good: #1d7a46; --warn: #a25c00; --bad: #b3261e;

}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --desk: #0e1116; --paper: #181c24; --ink: #e9edf3; --muted: #9aa5b6; --rule: #2a3545;
    --margin: #7d3d3d; --hl: #6e5c00; --pen: #a9bcff; --on-pen: #10162a; --chip: #212837; --good: #6fd39a; --warn: #f0b45a; --bad: #ff8a80; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --desk: #0e1116; --paper: #181c24; --ink: #e9edf3; --muted: #9aa5b6; --rule: #2a3545;
  --margin: #7d3d3d; --hl: #6e5c00; --pen: #a9bcff; --on-pen: #10162a; --chip: #212837; --good: #6fd39a; --warn: #f0b45a; --bad: #ff8a80; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--desk); color: var(--ink); font-family: var(--body); font-size: 17px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px 110px; }
#app { max-width: 680px; margin-inline: auto; display: flex; flex-direction: column; gap: 16px; }
h1, h2, h3 { font-family: var(--display); margin: 0; text-wrap: balance; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--pen); outline-offset: 2px; }
.sheet { background: var(--paper); border-radius: 4px; border-left: 2px solid var(--margin);
  padding-block: 20px; padding-inline: 18px 16px; display: flex; flex-direction: column; gap: 18px; min-width: 0; }
.mark { background: linear-gradient(transparent 52%, var(--hl) 52%, var(--hl) 94%, transparent 94%);
  -webkit-box-decoration-break: clone; box-decoration-break: clone; padding-inline: 2px; }
.cover h1 { font-size: 2rem; font-weight: 800; line-height: 1.1; }
.cover p { margin: 6px 0 0; color: var(--muted); }
.label { font-family: var(--display); font-size: .8rem; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); margin: 0; }
.search { width: 100%; min-height: 48px; padding: 10px 14px; background: var(--paper); border: 1.5px solid var(--rule); border-radius: 4px; }
.search::placeholder { color: var(--muted); }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1.5px solid var(--rule); background: var(--chip); cursor: pointer; font-weight: 700; font-size: .95rem; }

.recipe h1 { font-size: 1.9rem; font-weight: 800; line-height: 1.15; }

.block { display: flex; flex-direction: column; gap: 4px; }

.txt { min-width: 0; overflow-wrap: anywhere; }

.note { margin: 0; font-style: italic; }
.amt { color: var(--muted); }
.from { display: block; font-size: .85rem; color: var(--muted); }
.addbox { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

.small { flex: 0 0 auto; min-height: 48px; padding: 0 18px; }
.toast { color: var(--pen); font-weight: 700; margin: 0; }

.day { display: grid; grid-template-columns: 1fr; gap: 4px; padding: 14px 0; border-bottom: 1.5px solid var(--rule); }
.day:last-child { border-bottom: 0; }
.dname { font-family: var(--display); font-weight: 800; font-size: 1.1rem; }
.slots { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.slot { display: flex; align-items: center; gap: 6px; min-width: 0; }
.slot .k { flex: none; width: 44px; font-size: .75rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.slot .dish { flex: 1; min-width: 0; text-align: left; background: none; border: 0; padding: 6px 0; cursor: pointer; font-weight: 700; overflow-wrap: break-word; color: var(--ink); text-decoration-color: var(--rule); text-underline-offset: 3px; }
.slot .dish.none { color: var(--muted); font-weight: 400; font-style: italic; }
.slot .x { flex: none; background: none; border: 0; color: var(--pen); font-weight: 700; min-height: 40px; padding: 0 6px; cursor: pointer; font-size: .9rem; }
.picker { border: 1.5px solid var(--pen); border-radius: 4px; padding: 12px; display: flex; flex-direction: column; gap: 10px; margin-top: 6px; }
.picker .list { max-height: 300px; overflow-y: auto; display: flex; flex-direction: column; }
.picker .opt { text-align: left; background: none; border: 0; border-bottom: 1px solid var(--rule); padding: 10px 2px; cursor: pointer; min-height: 44px; }
.picker .opt:hover { color: var(--pen); }
.row2 { display: flex; gap: 10px; flex-wrap: wrap; }

#copy-fallback { width: 100%; min-height: 160px; padding: 10px 12px; background: var(--paper); border: 1.5px solid var(--rule); border-radius: 4px; }
.btn { flex: 1; min-height: 52px; border-radius: 4px; border: 1.5px solid var(--pen); background: var(--pen); color: var(--on-pen); font-family: var(--display); font-weight: 700; font-size: 1.05rem; cursor: pointer; padding: 0 14px; }
.btn.ghost { background: transparent; color: var(--pen); }

.tabs { position: fixed; left: 0; right: 0; bottom: 0; background: var(--paper); border-top: 1.5px solid var(--rule);
  padding: 6px max(16px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); z-index: 5; }
.tabs nav { max-width: 680px; margin-inline: auto; display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
.tabs a { font-size: .9rem !important; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 54px; border-radius: 4px; text-decoration: none; color: var(--muted); font-family: var(--display); font-weight: 700; font-size: .95rem; }
.tabs a[aria-current="page"] { color: var(--pen); background: var(--chip); }
.nut { display: flex; flex-direction: column; gap: 6px; padding-bottom: 14px; border-bottom: 1.5px solid var(--rule); }
.nut:last-child { border-bottom: 0; padding-bottom: 0; }
.nut-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.pill { font-size: .8rem; font-weight: 700; padding: 2px 10px; border-radius: 999px; border: 1.5px solid currentColor; }
.pill.good { color: var(--good); } .pill.some { color: var(--warn); } .pill.low { color: var(--bad); }
.meter { height: 8px; background: var(--chip); border-radius: 4px; overflow: hidden; }
.meter span { display: block; height: 100%; border-radius: 4px; }
.meter .good { background: var(--good); } .meter .some { background: var(--warn); } .meter .low { background: var(--bad); }
.sug { margin: 0; font-size: .95rem; } .sug a { color: var(--pen); font-weight: 700; }
.tabs .count { font-family: var(--body); font-weight: 400; font-size: .75rem; }

.cover { padding:28px 0 17px; }.cover h1 { font-size:clamp(36px,4vw,54px);font-weight:400;letter-spacing:-.045em;line-height:1.12; }.cover p { max-width:530px;font-size:15px;line-height:1.8;margin-top:16px; }

pple Crisp", "time": "", "ingredients": ["About 6 apples, chopped", "2 tbsp sugar", "¾ tsp cinnamon (apples)", "1½ tsp lemon juice", "1 cup light brown sugar", "¾ cup old fashioned oats", "¾ cup flour", "1 tsp cinnamon (topping)", "Pinch of salt", "½ cup cold unsalted butter, diced into small cubes", "Nonstick spray", "Caramel drizzle"], "steps": ["Preheat the oven to 350° and spray an 8x8 pan with nonstick spray.", "In a mixing bowl, add about 6 chopped apples, 2 tbsp sugar, ¾ tsp cinnamon, and 1½ tsp lemon juice. Stir and put in the baking dish.", "In a bowl, add the topping ingredients: 1 cup light brown sugar, ¾ cup of old fashioned oats, ¾ cup flour, 1 tsp cinnamon, a pinch of salt, and ½ cup of cold unsalted butter diced into small cubes.", "Spread the topping over the apples in the baking dish and gently pat to even out. Bake 40–50 minutes, until golden brown and bubbly."], "note": "Best with caramel drizzle.", "course": "dessert"}, {"id": "apple-glazed-chicken", "title": "Apple Glazed Chicken", "time": "", "ingredients": ["Chicken", "2 tbsp Dijon mustard (for the chicken)", "1 tbsp apple cider vinegar (for the chicken)", "2 tsp salt", "1 tsp black pepper", "1 tsp paprika", "2 tbsp butter (glaze)", "1 tbsp cornstarch (glaze)", "1 cup apple cider (glaze)", "1 tbsp Dijon mustard (glaze)", "1 tbsp brown sugar (glaze)", "1 tbsp apple cider vinegar (glaze)"], "steps": ["Chicken: coat with 2 tbsp Dijon mustard, 1 tbsp apple cider vinegar, 2 tsp salt, 1 tsp black pepper, and 1 tsp paprika. Bake at 425° for about 30 minutes.", "Glaze: melt 2 tbsp butter in a saucepan on medium-high heat.", "Whisk in 1 tbsp cornstarch until all the white is absorbed.", "Add 1 cup apple cider, 1 tbsp Dijon, 1 tbsp brown sugar, and 1 tbsp apple cider vinegar. Whisk until thickened, about 2 minutes.", "Brush the glaze on the chicken for the last 5 minutes."], "note": "", "course": "dinner"}, {"id": "arroz-doce", "title": "Arroz Doce (Vovó Style)", "time": "", "ingredients": ["1 tigela (2 cups) e meia de leite", "1 tigela e meia de água", "1 tigela de açúcar", "1 tigela de arroz", "1 casca de limão", "3 gemas de ovo (beat egg yolk)"], "steps": ["The notebook lists ingredients only. Tap Edit to add the directions."], "note": "The notebook lists ingredients only. 1 tigela = 2 cups.", "course": "dessert", "pt": 1}, {"id": "baked-honey-dijon-chicken-and-potatoes", "title": "Baked Honey Dijon Chicken & Potatoes", "time": "", "ingredients": ["Chicken breasts", "Potatoes, quartered", "½ cup melted butter", "¼ cup honey", "2 tbsp Dijon mustard", "½ tsp salt", "½ tsp oregano", "Salt and pepper, to taste"], "steps": ["Preheat the oven to 375°. Lightly grease a 9x13 baking dish.", "In a small mixing bowl, whisk together ½ cup melted butter, ¼ cup honey, 2 tbsp Dijon mustard, ½ tsp salt, and ½ tsp oregano.", "Place the chicken breasts into the baking dish. Surround the chicken with the quartered potatoes. Drizzle the honey mustard mixture over everything.", "Bake for about 40 minutes, until the potatoes are tender and the chicken is 165° internally.", "Give the potatoes a good toss and season with salt and pepper to taste before serving."], "note": "", "course": "dinner"}, {"id": "microwave-baked-potatoes", "title": "Baked Potatoes (Microwave)", "time": "about 14 min", "ingredients": ["Medium potatoes"], "steps": ["Cut the potatoes at the top.", "With a fork, punch holes around the potatoes so they won't pop.", "Cook for 9 minutes.", "Turn over and cook for 4–5 more minutes."], "note": "Use medium potatoes.", "course": "side"}, {"id": "balsamic-chicken-breast", "title": "Balsamic Chicken Breast", "time": "", "ingredients": ["Chicken breast", "Olive oil", "2 cloves garlic, minced", "2 tsp Italian seasoning", "1 cup chicken stock", "3 tbsp honey", "1 tbsp mustard", "⅓ cup balsamic vinegar", "Parsley (optional)"], "steps": ["Cut the chicken breast into small slices or chunks.", "On medium-low, add olive oil. Brown each side. Remove from the pan.", "Add 2 cloves minced garlic and 2 tsp of Italian seasoning. If too dry, add more olive oil.", "Deglaze with 1 cup chicken stock.", "Add 3 tbsp honey, 1 tbsp mustard, and ⅓ cup balsamic vinegar and mix on high heat.", "The sauce should thicken. Add the chicken back in to finish cooking.", "Add parsley to garnish (optional)."], "note": "", "course": "dinner"}, {"id": "banana-cornmeal-pancakes", "title": "Banana Cornmeal Pancakes", "time": "", "ingredients": ["1 mashed banana", "¼ cup cornmeal", "1 egg", "Splash of milk"], "steps": ["Mix everything together and cook as pancakes."], "note": "The notebook lists ingredients only.", "course": "extra"}, {"id": "banana-muffins", "title": "Banana Muffins", "time": "", "ingredients": ["1½ cups flour", "1 tsp baking powder", "1 tsp baking soda", "½ tsp salt", "3 large bananas", "¾ cup sugar", "1 egg", "⅓ cup butter"], "steps": ["Add the flour, baking powder, baking soda, and salt, and stir.", "In another bowl, mash the bananas. Add the sugar, egg, and butter, then add the flour mixture and stir.", "Grease the pan and bake at 350° for 25 minutes."], "note": "", "course": "dessert"}, {"id": "beef-barley-soup", "title": "Beef Barley Soup", "time": "1 hr 10 min", "ingredients": ["1 tbsp olive oil", "1 onion, chopped", "1 garlic clove, minced", "2 carrots, sliced", "1 rib celery, sliced", "2 cups cooked beef", "6 cups reduced-sodium beef broth", "1 can (14–15 oz) petite diced tomatoes, undrained", "½ green pepper, diced", "⅔ cup barley", "1 tbsp Worcestershire sauce", "¼ tsp dried thyme", "1 package beef gravy mix", "1 bay leaf", "2 tbsp red wine (optional)", "2 tbsp fresh parsley (or 2 tsp dried)", "Salt and pepper, to taste"], "steps": ["Cook the onion and garlic in the oil over medium heat until softened.", "Add everything else and bring to a boil. Reduce the heat and simmer, covered, about 40–50 minutes, until the barley is cooked.", "Remove the bay leaf and serve."], "note": "Serves 8. A good use for leftover roast beef. From Spend With Pennies.", "course": "soup"}, {"id": "beef-enchiladas", "title": "Beef Enchiladas", "time": "", "ingredients": ["Hamburg", "½ onion, chopped", "½ pepper, chopped", "1 can enchilada sauce", "Mexican blend cheese", "Cilantro, for garnish and flavor", "Rice (optional)", "Black beans and corn (optional)", "Flour tortillas"], "steps": ["Cook the beef, onion, and peppers in a pan.", "Add the rice, beans, corn, etc., and ½ of the enchilada sauce can.", "Stuff the enchiladas and add cheese inside.", "Sprinkle with more cheese and the rest of the sauce, and cook in the oven until melted.", "Garnish with cilantro."], "note": "", "course": "dinner"}, {"id": "beef-stroganoff", "title": "Beef Stroganoff", "time": "", "ingredients": ["Beef sirloin steak", "¼ cup flour", "Mushrooms", "Onion", "Pasta", "Olive oil", "¼ cup butter", "3 cups beef broth", "2 tbsp Worcestershire sauce", "1 tbsp Dijon mustard", "Salt and pepper", "1 cup sour cream"], "steps": ["Thinly slice the beef sirloin steak (against the grain).", "Spread the meat out on a board and dust with ¼ cup flour.", "Slice the mushrooms and onion.", "Boil a pot of water for the pasta.", "Cook the mushrooms and onion in olive oil until tender, 5–7 minutes.", "Remove from the skillet.", "Add the pasta to the water.", "Add ¼ cup butter to the skillet and add the steak.", "Pour in 3 cups beef broth when the steak is seared.", "Add 2 tbsp Worcestershire sauce.", "Add the mushrooms, onion, 1 tbsp Dijon mustard, salt, pepper, and 1 cup sour cream. Turn off the heat and stir.", "Add the pasta and stir."], "note": "", "course": "dinner"}, {"id": "beef-meat-sauce", "title": "Beef/Meat Sauce", "time": "", "ingredients": ["2 tbsp margarine", "2 cloves garlic", "Water", "1 or 2 beef bouillon", "6 tbsp milk", "2 tbsp flour"], "steps": ["Melt 2 tbsp margarine in a fry pan and sauté 2 cloves garlic.", "Add the water and beef bouillon, mix well, and boil 10 minutes.", "In a separate pan, heat 6 tbsp milk and 2 tbsp flour.", "Combine both mixtures hilis, deseeded", "1 cup water", "1 onion", "1 tomato", "Light olive oil", "6 garlic cloves", "1 tsp pepper", "1 tsp cumin", "1 tbsp oregano", "½ tsp smoked paprika", "1 tsp salt", "3 tbsp apple cider vinegar", "1½ cups beef broth", "Beef", "Tortillas", "Cheese", "Onions", "Cilantro", "Lime juice"], "steps": ["Consommé: deseed 4 dried chilis.", "Consommé: bring 1 cup water to a boil, then remove from the heat. Soak the chilis for 15 minutes.", "Consommé: in a skillet, sauté 1 onion and 1 tomato with light olive oil for 4–5 minutes.", "Consommé: add 6 garlic cloves and sauté 2 minutes.", "Consommé: transfer the vegetables and chilis to a blender with 1 tsp pepper, 1 tsp cumin, 1 tbsp oregano, ½ tsp smoked paprika, 1 tsp salt, 3 tbsp apple cider vinegar, and 1½ cups beef broth. Blend and set aside.", "Beef: sear the meat in light olive oil.", "Beef: pour the consommé over the meat (add water if needed to submerge the meat).", "Beef: cook on low for 45 minutes.", "Beef: remove the meat and shred.", "Beef: remove some consommé sauce for later.", "Tacos: dip tortillas in the consommé and fry on a skillet.", "Tacos: add cheese, onions, cilantro, lime juice, and meat.", "Tacos: fold over.", "Tacos: repeat and serve!"], "note": "", "course": "dinner"}, {"id": "biscoitos", "title": "Biscoitos", "time": "", "ingredients": ["4 cups Bisquick", "3 cups flour", "6 eggs", "1 stick butter", "1 tsp shortening", "1½ cups sugar", "Lemon peel", "2 tsp baking powder"], "steps": ["Beat the sugar, butter, eggs, and shortening.", "Mix in everything else by hand.", "Bake in a 350° oven for 20–25 minutes."], "note": "", "course": "dessert", "pt": 1}, {"id": "biscoitos-jiffy", "title": "Biscoitos (Jiffy Version)", "time": "", "ingredients": ["8 eggs", "3 cups sugar", "4 cups flour", "1 box “Jiffy” flour", "2 sticks butter", "Zest of 1 lemon"], "steps": ["Beat the sugar, butter, and eggs.", "Then mix in everything else by hand."], "note": "The page gives no oven temperature or time. The other bs.", "Mix together by hand.", "Bake at 350° for 45 minutes in a lightly greased loaf pan.", "After 45 minutes, put on the Stay at Home Chef glaze (½ cup ketchup, 1 tbsp Worcestershire sauce, 2 tbsp brown sugar) and bake another 15 minutes. Add cheese if desired."], "note": "", "course": "dinner"}, {"id": "black-forest-trifle", "title": "Black Forest Trifle", "time": "", "ingredients": ["1 box Devil's food cake", "1 box (5.9 oz) chocolate pudding", "1 tub (8 oz) Cool Whip", "1 can (21 oz) cherry or strawberry filling"], "steps": ["Crumble the cake into small pieces.", "Layer cake, pudding, fruit filling, and whipped cream, 2 or 3 times.", "Refrigerate for 1 hour."], "note": "", "course": "dessert"}, {"id": "blackened-blueberry-spinach-salad", "title": "Blackened & Blueberry Spinach Salad", "time": "", "ingredients": ["Spinach", "⅓ cup corn", "Dash of chili powder", "Dash of cumin", "Cooked chicken", "2 tsp lime juice", "Dash of salt and pepper", "Blueberries", "Feta", "Cilantro"], "steps": ["Place the spinach in a bowl.", "In a skillet over medium-high heat, add ⅓ cup corn and a dash of chili powder and cumin. Cook about 3 minutes, until blackened.", "Add the cooked chicken, 2 tsp lime juice, and a dash of salt and pepper.", "Cook and stir until hot.", "Top the salad with blueberries, feta, and cilantro."], "note": "Entire recipe: 20g carbs.", "course": "dinner"}, {"id": "bourbon-chicken", "title": "Bourbon Chicken", "time": "", "ingredients": ["Chicken", "Salt and pepper", "1 cup chicken broth", "1 cup orange juice", "½ cup brown sugar", "⅓ cup bourbon", "⅓ cup soy sauce", "2 tbsp minced garlic", "1 tbsp crushed red pepper or flakes", "2 tsp cornstarch", "¼ cup olive oil", "2 tbsp sesame oil"], "steps": ["In a mixing bowl, make the sauce: 1 cup chicken broth, 1 cup orange juice, ½ cup brown sugar, ⅓ cup bourbon, ⅓ cup soy sauce, 2 tbsp minced garlic, 1 tbsp crushed red pepper or flakes, and 2 tsp cornstarch.", "Heat ¼ cup olive oil and 2 tbsp sesame oil over medium heat for 1 minute.", "Add the chicken seasoned with salt and pepper and cook about 10 minutes.", "Stir in the sauce and simmer 10 minutes."], "note": "", "course": "dinner"}, {"id": "boursin-cheese-spaghetti", "title": "Boursin Cheese Spaghetti", "time": "about 45 min", "ingredients": ["8–10 oz spaghetti (about ¾ package)", "1 package (5.2 oz) garlic and herb Boursin cheese", "2–3 cups chicken broth", "2 handfuls fresh baby spinach", "1 tbsp olive oil", "Garlic powder, Italian seasoning, salt, and pepper, to taste", "Cooked chicken, diced or shredded (optional)"], "steps": ["Preheat the oven to 425°.", "Lay the spaghetti in a 9x13 baking dish, breaking the noodles in half if needed so they lie flat. Drizzle with the olive oil.", "Pour the chicken broth over until the noodles are mostly covered.", "Season with garlic powder, Italian seasoning, salt, and pepper.", "Set the Boursin right in the middle of the dish.", "Cover tightly with foil so the steam softens the pasta.", "Bake 35 minutes, until the pasta is tender and the liquid is mostly absorbed.", "Stir hard as soon as it comes out. The Boursin and broth turn into a creamy sauce.", "Stir in the spinach while it's piping hot and cover 2–3 minutes until wilted. Add the chicken now if using."], "note": "Add cooked chicken for extra protein.", "course": "dinner"}, {"id": "broccoli-and-cheddar-soup", "title": "Broccoli & Cheddar Soup", "time": "", "ingredients": ["4 tbsp butter", "1 medium onion, chopped", "2 stalks celery, chopped", "¼ cup flour", "3 cups chicken broth", "Salt, to taste", "Pepper, to taste", "1 large head broccoli, chopped", "1 large carrot, grated", "2 cups milk", "3 cups shredded cheddar"], "steps": ["In a large pot on medium heat, melt the butter. Add the onion and celery and cook until soft (5 minutes). Whisk in the flour and let cook 1 minute. Add the chicken broth and season with salt and pepper.", "Stir in the broccoli and carrots. Bring to a boil and reduce the heat to low. Let simmer until the vegetables are tender (20 minutes).", "Add the milk and bring to a simmer. Add the cheddar.", "Season with salt and pepper."], "note": "Serves 4.", "course": "soup"}, {"id": "brown-butter-zoodles-and-sausage", "title": "Brown Butter Zoodles & Sausage", "time": "", "ingredients": ["Zucchini, for zoodles", "Sausage (ground is best)", "½ tsp garlic powder", "½ tsp onion powder", "½ tsp ground pepper", "½ tsp Italian seasoning", "¾ to 1 stick unsalted butter", "2 cloves garlic, cut in half", "Parmesan cheese", "Parsley"], "steps": ["Spiralize the zoodles.", "Cook the sausage (ground is best).", "Remove from the pan and sauté the zoodles with half a teaspoon of garlic powder, onion powder, ground pepper, and Italian seasoning for about 10 minutes. Set aside and add the sausage back in.", "For the butter sauce, melt about ¾ or a full stick of unsalted butter in a separate saucepan.", "Once bubbling, add 2 cloves garlic cut in half.", "Once brown, remove from the heat and pour over the zoodles and sausage.", "Sprinkle with Parmesan cheese and parsley and serve."], "note": "", "course": "dinner"}, {"id": "buffalo-cauliflower", "title": "Buffalo Cauliflower", "time": "", "ingredients": ["Cauliflower pieces", "¾ cup flour", "2 tsp garlic powder", "1 tsp paprika", "½ tsp pepper", "1 tsp salt", "¾ cup milk", "½ cup hot sauce", "2 tbsp oil"], "steps": ["Stir the flour, garlic powder, paprika, pepper, salt, and milk in a bowl.", "Add the cauliflower pieces and stir.", "Bake at 450° for 20 minutes.", "Mix ½ cup hot sauce and 2 tbsp oil and paint over the cauliflower pieces.", "Bake at 450° for 20 minutes."], "note": "", "course": "side"}, {"id": "buffalo-chicken-penne", "title": "Buffalo Chicken Penne", "time": "", "ingredients": ["8 oz penne pasta", "8 oz cream cheese", "¾ cup ranch", "⅓ cup hot sauce", "2 cups shredded chicken", "1½ cups mozzarella cheese", "½ cup cheddar", "Green onions, for garnish"], "steps": ["The notebook lists ingredients only. Tap Edit to add the directions."], "note": "The notebook lists ingredients only for this one.", "course": "dinner"}, {"id": "buffalo-chicken-power-bowl", "title": "Buffalo Chicken Power Bowl", "time": "", "ingredients": ["Cauliflower rice", "Shredded carrots", "¼ tsp garlic powder", "¼ tsp onion powder", "Chicken", "Frank's hot sauce", "Blue cheese crumbles"], "steps": ["Make cauliflower rice with shredded carrots, ¼ tsp garlic powder, and ¼ tsp onion powder.", "Shred the chicken or cut into bite-sized pieces.", "Toss in Frank's.", "Add blue cheese crumbles."], "note": "", "course": "dinner"}, {"id": "butterscotch-cake", "title": "Butterscotch Cake", "time": "", "ingredients": ["1 package white cake mix", "1 cup water", "1 small package butterscotch instant pudding", "½ cup oil", "4 eggs", "½ cup chocolate syrup", "Confectioners sugar"], "steps": ["Mix the cake mix, pudding, water, and oil in a bowl. Beat 2 minutes.", "Add the eggs and beat well. Pour ⅔ of the batter into a well greased 10 inch pan.", "Mix the rest of the batter with the chocolate syrup and pour evenly over the butterscotch mixture.", "Bake at 350° for 50–60 minutes.", "Cool 30 minutes in the pan, then thoroughly on a wire rack.", "Sprinkle with confectioners sugar."], "note": "", "course": "dessert"}, {"id": "cabbage-and-white-bean-soup", "title": "Cabbage & White Bean Soup", "time": "", "ingredients": ["1 tbsp olive oil", "3 cups cabbage", "1 large carrot, sliced", "1 tbsp garlic", "5 cups broth", "1 cup water", "1 can diced tomatoes, not drained", "1 or 2 cans cannellini beans", "Salt and pepper"], "steps": ["Heat 1 tbsp olive oil. Add 3 cups cabbage, 1 large sliced carrot, and 1 tbsp garlic. Cover and cook about 2 minutes, until the cabbage is wilted.", "Increase the heat to high. Add 5 cups broth, 1 cup water, and 1 can diced tomatoes, not drained. Cover and cook about 10 minutes.", "Mash 1 or 2 cans of cannellini beans and add to the soup. Boil about 2 minutes and serve.", "Add salt and pepper to taste."], "note": "", "course": "soup"}, {"id": "cajun-seasoning", "title": "Cajun Seasoning", "time": "", "ingredients": ["1 tbsp paprika", "1 tbsp onion powder", "1 tbsp garlic powder", "1 tbsp oregano", "1 tbsp basil", "1 tbsp salt", "1 tsp thyme", "1 tsp black pepper", "1 tsp white pepper", "1 tsp cayenne pepper"], "steps": ["Mix everything together."], "note": "", "course": "extra"}, {"id": "cajun-stuffed-chicken-breast", "title": "Cajun Stuffed Chicken Breast", "time": "", "ingredients": ["1 tbsp paprika (seasoning)", "1 tbsp onion powder (seasoning)", "1 tbsp garlic powder (seasoning)", "1 tbsp oregano (seasoning)", "1 tbsp basil (seasoning)", "1 tbsp salt (seasoning)", "1 tsp thyme (seasoning)", "1 tsp black pepper (seasoning)", "1 tsp white pepper (seasoning)", "1 tsp cayenne pepper (seasoning)", "Chicken breasts", "1 tbsp olive oil", "Sliced mushrooms", "½ red pepper", "½ green pepper", "½ onion", "Pepper jack cheese", "1 tbsp butter per breast"], "steps": ["Make the Cajun seasoning: mix 1 tbsp each of paprika, onion powder, garlic powder, oregano, basil, and salt with 1 tsp each of thyme, black pepper, white pepper, and cayenne pepper.", "Preheat the oven to 400°.", "Heat 1 tbsp olive oil over medium-high heat and sauté sliced mushrooms, half a red pepper, half a green pepper, and ½ onion for 5 minutes.", "Use a meat tenderizer to flatten out the chicken, then season it with the Cajun seasoning.", "Place pepper jack cheese and a spoonful of the veggie mixture on each breast.", "Fold over and secure with a toothpick.", "Add 1 tbsp butter over each breast and a little bit more cheese.", "Put in the oven for about 30 minutes.", "Serve with rice, pasta, buttered noodles, etc."], "note": "Serve with rice, pasta, buttered noodles, etc. The seasoning makes more than one batch needs, so save the rest.", "course": "dinner"}, {"id": "caldo-verde", "title": "Caldo Verde", "time": "", "ingredients": ["About 2 quarts water", "1 onion, finely chopped", "1 clove garlic", "3 tbsp olive oil (plus more to finish)", "Kale, finely chopped", "Chouriço, finely sliced", "Mashed potatoes (homemade or instant)", "Salt", "Bouillon cube"], "steps": ["In a pot with about 2 quarts of water, add one finely chopped onion, 1 clove garlic, and 3 tbsp of olive oil, and boil.", "Add the finely chopped kale.", "If using homemade mashed potatoes, cook them separately to make them thin. If using instant, it will be added at the very end.", "Slice the chouriço finely and add it with the kale to the pot.", "Cook until tender, then add the mashed potatoes and a little salt. Keep stirring and add more olive oil.", "Add another cube if it needs more flavoring."], "note": "Add another cube if it needs more flavoring.", "course": "soup", "pt": 1}, {"id": "camarao-mocambique", "title": "Camarão Moçambique à Leonor Santos", "time": "", "ingredients": ["1 package shrimp", "½ stick butter", "Olive oil", "Salt", "1 Goya package", "Beer", "1 tbsp crushed red pepper", "Hot sauce", "½ onion", "1 tbsp crushed garlic", "Lemon juice", "Parsley"], "steps": ["Melt ½ stick butter and olive oil in a pan and simmer.", "Add the crushed garlic and onion.", "Add the shrimp and a light amount of salt.", "When pink, add the crushed red pepper, Goya, and beer, and squeeze in lemon juice.", "Stir and add parsley.", "Add hot sauce for extra spice."], "note": "", "course": "dinner", "pt": 1}, {"id": "caribbean-salmon", "title": "Caribbean Salmon", "time": "", "ingredients": ["Salmon", "¼ tsp chili powder", "Garlic powder", "Onion powder", "Dash of salt and pepper", "Veggies of choice", "Chopped pineapple", "Tomato", "Cilantro", "Nonstick spray"], "steps": ["Heat the oven to 375° and spray a baking sheet.", "Put the salmon on the baking sheet with ¼ tsp chili powder, garlic powder, onion powder, and a dash of salt and pepper.", "Add veggies of choice and bake about 14 minutes.", "In a medium bowl, combine chopped pineapple, tomato, cilantro, and a dash of salt and pepper. Mix and serve over the salmon."], "note": "", "course": "dinner"}, {"id": "carne-alentejana", "title": "Carne Alentejana", "time": "", "ingredients": ["1½ cups white wine", "1 tsp paprika", "2½ tsp salt", "¼ tsp black pepper", "2 cloves garlic, cut", "1 bay leaf", "2 lbs pork", "3 tsp olive oil", "2 onions", "2 tsp chopped garlic", "2 tomatoes, chopped and peeled", "¼ tsp crushed red pepper", "Little necks, scrubbed", "¼ cup parsley, chopped", "Potatoes"], "steps": ["Marinate 7 thighs for 6 hours.", "Drain the pork. Reserve the marinade and discard the bay leaf.", "Melt 1 tsp oil in a skillet, add the pork, and stir and cook.", "Put aside in a bowl.", "Fry the potatoes and set aside.", "Put the marinade in the skillet and bring to a boil. Pour over the pork and put aside in the bowl.", "In a pan, heat 2 tsp olive oil and the onion, and sauté until the onion is soft, not brown.", "Add the garlic, tomatoes, and pepper. Simmer and stir for 5 minutes.", "Put the clams (hinge down) over the sauce.", "Cover the pan and cook 10 minutes.", "Stir in the pork, juices, and potatoes.", "Simmer 5 minutes and sprinkle with fresh parsley."], "note": "The page doesn't list an amount for the potatoes or little necks.", "course": "dinner", "pt": 1}, {"id": "slow-cooker-carnitas", "title": "Carnitas Slow Cooker", "time": "", "ingredients": ["Pork chops", "2 tsp salt", "1 tsp pepper", "1 tbsp oregano", "1 tbsp cumin", "8 cloves garlic", "1 onion", "3 bay leaves", "Lime juice", "Orange juice"], "steps": ["Mix everything in the slow cooker.", "Cook on low for 8 hours."], "note": "", "course": "dinner"}, {"id": "carrot-cake", "title": "Carrot Cake", "time": "about 1 hr 45 min", "ingredients": ["3 cups flour", "1 tsp baking powder", "1 tsp baking soda", "1 tsp cinnamon", "2 cups sugar", "1½ cups salad oil", "3 eggs", "2 tsp vanilla", "1 small can crushed pineapple, not drained", "2 cups grated fresh carrots", "1 cup nuts (optional)", "1 small package cream cheese (frosting)", "Milk (frosting)", "Powdered sugar (frosting)"], "steps": ["Heat the oven to 325° and butter a tube pan.", "Sift the dry ingredients.", "Combine the sugar, oil, and eggs, and beat with the vanilla.", "Add the dry ingredients and blend, but don't overmix.", "Lastly, fold in the pineapple, carrots, and nuts.", "Pour into the buttered tube pan and bake 1 hour 20 minutes.", "Cool 10 minutes before turning out.", "Frost with cream cheese, milk, and powdered sugar."], "note": "From the kitchen of Jeanne M. Arnold. The back of the card also lists \"1 pk. carrots\" — probably a bag of carrots for the 2 cups grated.", "course": "dessert"}, {"id": "cheeseburger-heaven", "title": "Cheeseburger Heaven", "time": "", "ingredients": ["Ground beef", "1 cup chopped onion", "1 tsp garlic powder", "¼ tsp salt and pepper", "⅓ cup cheddar cheese", "⅓ cup cream cheese", "3 tbsp ketchup", "1 tbsp mustard", "Tomatoes", "Pickles"], "steps": ["In a skillet over medium-high heat, add the beef, 1 cup chopped onion, 1 tsp garlic powder, and ¼ tsp salt and pepper. Cook about 5 minutes.", "Reduce the heat to medium. Add ⅓ cup cheddar cheese, ⅓ cup cream cheese, 3 tbsp ketchup, 1 tbsp mustard, tomatoes, and pickles. Cook about 2 minutes."], "note": "", "course": "dinner"}, {"id": "cheesy-broc-wheels", "title": "Cheesy Broc Wheels", "time": "", "ingredients": ["Sheet pastry", "Cream cheese", "Boiled broccoli", "Cheese"], "steps": ["Lay out the sheet pastry.", "Smear with cream cheese.", "Add the boiled broccoli and cheese.", "Roll and cut.", "Bake at 350° for 15–20 minutes."], "note": "", "course": "side"}, {"id": "chicken-breast-and-sliced-bacon", "title": "Chicken Breast & Sliced Bacon", "time": "", "ingredients": ["4 skinless, boneless chicken breasts", "Seasoned bread crumbs", "⅛ cup olive oil", "Red pepper, cut in half circles", "Sliced onion", "2–3 garlic cloves", "Fresh basil", "Chopped parsley", "Ground pepper", "Uncooked bacon strips", "Swiss, pepper jack, or whatever cheese"], "steps": ["Sauté in ⅛ cup olive oil: the red pepper cut in half circles, sliced onion, 2–3 garlic cloves, fresh basil, chopped parsley, and ground pepper.", "Wash 4 skinless, boneless chicken breasts and roll them in seasoned bread crumbs.", "Place the chicken in an oiled baking pan.", "Divide the sautéed pepper mixture between the chicken.", "Top with uncooked bacon strips.", "Bake at 425° for 25 minutes.", "Top with Swiss, pepper jack, or whatever cheese and melt."], "note": "", "course": "dinner"}, {"id": "chicken-burger-meatball-hidden-veg", "title": "Chicken Burger/Meatball with Hidden Veg", "time": "", "ingredients": ["Ground chicken", "Grated carrot", "Spinach", "Egg", "Breadcrumbs"], "steps": ["The notebook lists ingredients only. Tap Edit to add the directions."], "note": "The notebook lists the add-ins only, with no amounts or directions.", "course": "dinner"}, {"id": "chicken-caprese", "title": "Chicken Caprese", "time": "", "ingredients": ["Chicken", "2 tbsp olive oil", "1 tsp salt", "1 tsp black pepper", "1 tsp garlic powder", "Cherry tomatoes", "Zucchini (optional)", "Mozzarella cheese", "Balsamic glaze", "Fresh basil"], "steps": ["Preheat the oven to 400° and grease a pan.", "Drizzle the chicken with 2 tbsp olive oil, 1 tsp salt, 1 tsp black pepper, and 1 tsp garlic powder.", "Spread cherry tomatoes around. You can add zucchini too.", "Bake 15 minutes.", "Put on the mozzarella cheese and continue baking until done.", "Drizzle with balsamic glaze and add fresh basil."], "note": "", "course": "dinner"}, {"id": "chicken-cordon-bleu", "title": "Chicken Cordon Bleu", "time": "", "ingredients": ["4 skinless, boneless chicken breasts", "¼ tsp salt", "⅛ tsp black pepper", "6 slices Swiss cheese", "4 slices cooked ham", "½ cup seasoned bread crumbs", "Cooking spray"], "steps": ["Heat the oven to 350° and coat a 7x11 baking dish with cooking spray.", "Pound the chicken to ¼ inch thickness.", "Sprinkle each piece with salt and pepper on both sides.", "Place 1 piece of cheese and 1 ham slice on top.", "Roll up each breast and secure with a toothpick.", "Place in the baking dish and sprinkle the chicken evenly with bread crumbs.", "Bake 30–35 minutes, or until no pink.", "Remove from the oven, place ½ slice of cheese on top of each breast, and melt. Remove the picks."], "note": "", "course": "dinner"}, {"id": "chicken-enchilada-bowl", "title": "Chicken Enchilada Bowl", "time": "", "ingredients": ["Cauliflower rice", "Chopped onions", "Cooked chicken", "Enchilada sauce", "Cheese", "Taco seasoning"], "steps": ["Make cauliflower rice with chopped onions.", "Coat the cooked chicken with enchilada sauce. Add cheese and taco seasoning."], "note": "", "course": "dinner"}, {"id": "chicken-gnocchi-soup", "title": "Chicken Gnocchi Soup", "time": "", "ingredients": ["1¼ cups chopped chicken (thighs, breast, etc.), cooked or boiled", "1 cup shredded carrots", "½ cup chopped celery", "2 garlic cloves, minced", "1 onion, diced", "1½ cups spinach", "½ tsp dried parsley", "½ tsp thyme", "½ tsp nutmeg", "½ stick unsalted butter", "1 tbsp olive oil", "¼ cup flour", "16 oz gnocchi", "1 quart half and half (or ½ milk, ½ heavy cream)", "32 oz chicken broth", "½ cup Parmesan cheese", "Salt"], "steps": ["Melt the butter with the olive oil and add the onion and celery on medium.", "Add the garlic and ½ tsp salt.", "Add the flour and mix.", "Add the half and half on medium-high and simmer.", "Add the chicken broth.", "Add the thyme, parsley, and nutmeg.", "Add the carrots.", "Add the boiled gnocchi.", "Add the cooked chicken and ½ cup Parmesan cheese.", "Add 1 tsp salt and the spinach, and it's ready."], "note": "", "course": "soup"}, {"id": "chicken-katsu", "title": "Chicken Katsu", "time": "", "ingredients": ["Chicken breast", "1 tsp garlic powder (chicken)", "1 tsp pepper", "1 tsp salt", "Flour", "Panko breadcrumbs", "1 egg", "1 tbsp milk", "Spray oil", "Rice", "½ cup ketchup (sauce)", "2 tbsp Worcestershire sauce (sauce)", "1 tbsp mustard (sauce)", "1 tbsp soy sauce (sauce)", "1 tsp garlic powder (sauce)", "1 tsp brown sugar (sauce)"], "steps": ["Katsu sauce: in a bowl, combine ½ cup ketchup, 2 tbsp Worcestershire sauce, 1 tbsp mustard, 1 tbsp soy sauce, 1 tsp garlic powder, and 1 tsp brown sugar.", "Cut the chicken breast ½ inch thick (may require pounding). Be sure it's even.", "Season the chicken on both sides with 1 tsp garlic powder, 1 tsp pepper, and 1 tsp salt.", "In 3 separate bowls, put flour, panko breadcrumbs, and 1 egg with 1 tbsp milk.", "Coat both sides and put in the air fryer with spray oil at 350° for 15 minutes.", "Serve over rice."], "note": "", "course": "dinner"}, {"id": "chicken-marsala", "title": "Chicken Marsala", "time": "", "ingredients": ["Chicken breasts", "Salt and pepper", "½ cup flour", "Olive oil", "Mushrooms", "4 cloves garlic", "1 cup marsala wine", "½ cup chicken broth", "Chopped parsley"], "steps": ["Season the chicken breasts with salt and pepper on both sides.", "Spread ½ cup of flour into a bowl.", "Dip the chicken breasts on both sides into the flour and set on a cutting board.", "Drizzle olive oil in a pan on medium-high.", "Add in the chicken, 5–7 minutes per side.", "Remove the chicken and add a little more oil.", "Add mushrooms until softened, 3–4 minutes.", "Add 4 cloves garlic, then pour in 1 cup marsala wine and ½ cup chicken broth.", "Simmer on medium-high about 7 minutes.", "Reduce the heat to low and heat the chicken.", "Garnish with chopped parsley."], "note": "", "course": "dinner"}, {"id": "chicken-meatball-fajitas", "title": "Chicken Meatball Fajitas", "time": "", "ingredients": ["Bell peppers", "Onions", "Oil", "1 tsp taco seasoning (veggies)", "Ground chicken", "2 tsp taco seasoning (meatballs)", "2 tbsp bread crumbs", "1 egg", "Nonstick spray"], "steps": ["Preheat the oven to 400°. Spray a baking sheet with nonstick.", "Place bell peppers and onions on the sheet. Drizzle with oil, sprinkle with 1 tsp taco seasoning, and mix. Bake about 6 minutes.", "Place the chicken in a large bowl. Add 2 tsp taco seasoning, 2 tbsp bread crumbs, and 1 egg, and mix. Make 10 meatballs.", "Bake about 10 minutes on the same baking sheet."], "note": "", "course": "dinner"}, {"id": "chicken-noodle-soup", "title": "Chicken Noodle Soup", "time": "", "ingredients": ["Chicken breasts", "Salt and pepper", "Olive oil", "½ to 1 onion", "2–3 carrots", "2–3 stalks celery", "2 tbsp butter", "1 tbsp minced garlic", "8 cups chicken broth (or water and bouillon cubes)", "½ tsp thyme", "½ tsp oregano", "Noodles of your choice"], "steps": ["Season the chicken breasts with salt and pepper.", "Sear 3–4 minutes per side in a pan with olive oil (it doesn't need to be cooked all the way).", "Remove and set aside on a plate.", "Chop ½ to 1 onion, 2–3 carrots, and 2–3 stalks of celery.", "Add 2 tbsp butter to a pot and melt.", "Add the vegetables and sauté for 5–7 minutes.", "Add 1 tbsp minced garlic and sauté for 1 minute.", "Add 8 cups chicken broth (or water and cubes).", "Place the chicken back in to finish cooking in the soup.", "Season with pepper, ½ tsp thyme, and ½ tsp oregano. More salt is optional.", "Add your choice of noodles.", "Pull out the chicken breasts and chop or shred.", "Put the chicken back in the pot and see if it needs anything else."], "note": "", "course": "soup"}, {"id": "chicken-souvlaki-salad", "title": "Chicken Souvlaki Salad", "time": "", "ingredients": ["Salad", "1 tbsp lemon juice", "1½ tsp olive oil", "1 tsp honey", "⅛ tsp garlic powder", "⅛ tsp oregano", "1½ tsp water", "Chicken", "¼ cup chopped onion", "⅛ tsp salt and pepper", "Feta (optional)", "Nonstick spray"], "steps": ["Make the salad.", "Sauce: in a small bowl, combine 1 tbsp lemon juice, 1½ tsp olive oil, 1 tsp honey, ⅛ tsp garlic powder, ⅛ tsp oregano, and 1½ tsp water, and whisk.", "Bring a skillet sprayed with nonstick to medium-high heat. Add the chicken, ¼ cup chopped onion, ⅛ tsp salt and pepper, and the sauce. Cook about 5 minutes, until the chicken is cooked and the onion has softened.", "Spoon the chicken mixture over the salad. Add feta if desired."], "note": "Entire recipe: 21g carbs.", "course": "dinner"}, {"id": "chicken-veggie-soup", "title": "Chicken Veggie Soup", "time": "", "ingredients": ["3 cups cooked chicken", "1 zucchini, cut into moon shaped slices", "1 cup carrots, chopped", "1 cup celery, chopped", "1 medium onion, chopped", "3 cloves garlic, chopped", "1 bay leaf", "2 tsp Worcestershire sauce", "8 cups chicken stock", "1 tbsp olive oil", "Salt and pepper", "Lemon, for flavor"], "steps": ["Heat the oil in a soup pot on medium-high.", "Add the onions and stir.", "Add the zucchini and stir.", "Add the carrots and celery and stir.", "Add the garlic and stir.", "Add salt and pepper and stir.", "Add the Worcestershire sauce and stir.", "Add the chicken broth and stir.", "Add the chicken and bay leaf.", "Simmer 20 minutes and serve, adding lemon for flavor."], "note": "", "course": "soup"}, {"id": "chicken-waldorf-slaw", "title": "Chicken Waldorf Slaw", "time": "", "ingredients": ["Cooked chicken", "Coleslaw mix", "½ cup chopped apple", "½ cup chopped grapes", "¼ cup chopped celery", "2 tbsp chopped walnuts", "½ cup plain Greek yogurt", "2 tbsp mayo", "2 tsp mustard", "1 tsp lemon juice"], "steps": ["In a large bowl, combine the cooked chicken, coleslaw mix, ½ cup chopped apple, ½ cup chopped grapes, ¼ cup chopped celery, and 2 tbsp chopped walnuts, and toss.", "In a small bowl, combine ½ cup plain Greek yogurt, 2 tbsp mayo, 2 tsp mustard, and 1 tsp lemon juice, and mix.", "Add both bowls together."], "note": "¼ serving: 11g carbs.", "course": "dinner"}, {"id": "chili-lime-baked-chicken-tenders", "title": "Chili-Lime Baked Chicken Tenders", "time": "", "ingredients": ["Chicken tenders", "2 limes", "1½ cups panko bread crumbs", "2 tsp ancho chili powder", "1 tsp salt", "½ cup butter, melted"], "steps": ["Heat the oven to 375° and grease a baking sheet.", "Zest 2 limes and place the zest in a mixing bowl.", "Stir 1½ cups panko bread crumbs, 2 tsp ancho chili powder, and 1 tsp salt in with the zest. Set aside.", "In another mixing bowl, squeeze the juice of the 2 limes into ½ cup melted butter.", "Dip the chicken in the butter mixture, then the breadcrumbs.", "Bake 30–40 minutes."], "note": "Goes with the Chili-Lime Dipping Sauce.", "course": "dinner"}, {"id": "chili-lime-dipping-sauce", "title": "Chili-Lime Dipping Sauce", "time": "", "ingredients": ["½ cup plain Greek yogurt", "Juice of 1 medium lime", "1 tsp ancho chili powder", "¼ tsp salt"], "steps": ["Combine ½ cup plain Greek yogurt, the juice of 1 medium lime, 1 tsp ancho chili powder, and ¼ tsp salt. Stir until combined."], "note": "", "course": "extra"}, {"id": "chimichangas", "title": "Chimichangas", "time": "", "ingredients": ["Cooked meat", "Green chilis", "½ onion", "1 tsp cumin", "½ tsp chili powder", "½ tsp garlic powder", "Salt and pepper", "Tortillas", "Refried beans", "Cheese", "Sour cream (optional)", "Oil spray"], "steps": ["In a large bowl, combine the cooked meat, green chilis, ½ onion, 1 tsp cumin, ½ tsp chili powder, and ½ tsp garlic powder. Season with salt and pepper to taste.", "Assembly: add the meat mixture, refried beans, and cheese, and maybe sour cream if desired.", "Air fryer: spray the bottom with oil, then spray the top with oil. Cook 6–8 minutes at 375°."], "note": "", "course": "dinner"}, {"id": "chipotle-black-bean-burgers", "title": "Chipotle Black Bean Burgers", "time": "", "ingredients": ["½ red onion", "1–2 chipotles", "4 cloves garlic", "2 cans (15 oz) black beans, rinsed", "1 cup plain bread crumbs", "1½ tsp cumin", "½ tsp salt and pepper", "2 eggs"], "steps": ["Place ½ red onion, 1–2 chipotles, and 4 cloves garlic in a food processor and process until finely chopped.", "Add 2 rinsed 15 oz cans of black beans and process until partially chopped. Put in a mixing bowl.", "Stir in 1 cup plain bread crumbs, 1½ tsp cumin, ½ tsp salt and pepper, and 2 eggs until well combined.", "Form 8 patties. Cook at 400° for 5 minutes each side, or grill the same way."], "note": "", "course": "dinner"}, {"id": "chocolate-bread-pudding", "title": "Chocolate Bread Pudding", "time": "about 1 hr 15 min", "ingredients": ["2 cups milk, warmed", "4 cups bread crumbs", "¼ cup oil", "½ cup sugar", "2 eggs", "¼ tsp salt", "½ tsp vanilla", "2 chocolate squares", "About 3 cups powdered sugar (frosting)", "2 tbsp shortening (frosting)", "1 tsp vanilla (frosting)", "About ½ tsp salt (frosting)", "Milk, a little at a time (frosting)", "2 chocolate squares, for chocolate frosting (optional)"], "steps": ["Heat the oven to 350°.", "In a large bowl, combine the bread crumbs and warm milk.", "Beat the eggs, add them to the bread and milk, and mix.", "Add the rest of the ingredients and mix well.", "Pour into a greased casserole dish and bake about 1 hour.", "Frosting: put about 3 cups powdered sugar (or more) in a medium bowl. Add 2 tbsp shortening, 1 tsp vanilla, and a few shakes of salt, about ½ tsp.", "Add milk slowly, mixing each time you add it. If it's too thick, add a little more milk. If it's too runny, add more powdered sugar. That's it.", "For chocolate frosting, add 2 chocolate squares. Or use food coloring for different colors."], "note": "If you use more bread crumbs, add more milk. If it bubbles up while baking, stick a knife in and pull it toward you a little to let some air out. It's OK. For the frosting: when adding milk, be careful. It doesn't take much.", "course": "dessert"}, {"id": "chocolate-chip-cheesecake-bars", "title": "Chocolate Chip Cheesecake Bars", "time": "", "ingredients": ["2 frozen rolls of chocolate chip cookies", "2 packets (8 oz each) cream cheese", "½ cup sugar", "2 eggs", "1 tsp vanilla extract"], "steps": ["Grease a 13x9 pan and put in one roll of cookies.", "Mix the cream cheese, eggs, sugar, and vanilla, and pour over the cookie layer.", "Take the 2nd roll and put it on top of that.", "Bake at 350° for 45 minutes."], "note": "", "course": "dessert"}, {"id": "chocolate-mousse-pie", "title": "Chocolate Mousse Pie", "time": "", "ingredients": ["Oreo crumbs", "5 tbsp butter", "6 oz semi sweet chocolate", "1½ cups heavy cream (mousse)", "3 egg whites", "2 tbsp sugar", "¼ cup powdered sugar (topping)", "1 cup heavy cream (topping)"], "steps": ["For the crust, crush up Oreo crumbs, melt 5 tbsp of butter, and press into a pan. Chill 30 minutes.", "Melt 6 oz of semi sweet chocolate by double boiling, 9–10 minutes.", "Add 1½ cups heavy cream to a well chilled bowl and whisk with a machine mixer until stiff peaks form, about 2 minutes.", "Whisk 3 egg whites in another bowl until soft peaks form, about 3 minutes.", "Add 2 tbsp sugar to the egg whites and continue to whisk about 2 minutes.", "Once the chocolate is melted, add ¼ of the whipped cream to the chocolate and mix by hand. Then add the egg whites and remaining whipped cream and mix.", "Put on top of the pie crust and chill 1 hour or overnight.", "For the topping, beat ¼ cup of powdered sugar and 1 cup of heavy cream.", "Spread on top of the pie and chill 30 minutes or overnight."], "note": "Margin note on the page: 16 oz heavy cream.", "course": "dessert"}, {"id": "chocolate-peanut-butter-pie", "title": "Chocolate Peanut Butter Pie", "time": "", "ingredients": ["25 Oreos", "4 tbsp melted butter", "1 cup creamy peanut butter", "8 oz package cream cheese, softened", "8 oz Cool Whip, thawed", "1¼ cups powdered sugar"], "steps": ["Crust: preheat to 350°. Crush the cookies, with the middle cream, into fine crumbs and add the melted butter. Add to a pan.", "Bake the crust 5–7 minutes. Remove and cool.", "Filling: beat the peanut butter with the cream cheese until smooth. Add the powdered sugar and beat until smooth. Add the thawed whipped topping and beat until smooth. Add the mixture to the crust.", "Chill for 1 hour before serving."], "note": "", "course": "dessert"}, {"id": "chourico-and-peppers", "title": "Chouriço & Peppers", "time": "", "ingredients": ["1 lb chouriço", "1 onion, chopped", "1 green pepper, chopped", "Olive oil", "½ can beer", "1 can tomato sauce"], "steps": ["Sauté the onion and pepper in olive oil.", "Add the chouriço, tomato sauce, and beer.", "Heat (covered) until ready."], "note": "", "course": "dinner", "pt": 1}, {"id": "cilantro-lime-rice", "title": "Cilantro Lime Rice", "time": "", "ingredients": ["2 tbsp olive oil", "½ onion", "2 cups rice", "4 cups water", "Salt", "⅓ cup lime juice", "½ cup cilantro", "2 tbsp butter"], "steps": ["Heat 2 tbsp olive oil in a large saucepan over medium-high heat.", "Add ½ onion and sauté 3 minutes.", "Add 2 cups rice and toast 3 minutes.", "Add 4 cups water and salt. Bring to a boil.", "Reduce the heat to low once all the liquid is gone.", "Stir in ⅓ cup lime juice, ½ cup cilantro, and 2 tbsp butter.", "Simmer a couple of minutes, stir, and add more salt to taste."], "note": "", "course": "side"}, {"id": "cinnamon-honey-butter-mashed-sweet-potatoes", "title": "Cinnamon Honey Butter Mashed Sweet Potatoes", "time": "", "ingredients": ["Sweet potatoes", "About ½ cup butter (less if desired)", "⅓ cup milk", "½ tsp cinnamon", "1 tbsp honey"], "steps": ["Boil the sweet potatoes on high.", "Add about ½ cup butter (less if desired), ⅓ cup milk, ½ tsp cinnamon, and 1 tbsp honey.", "Mash and serve."], "note": "", "course": "side"}, {"id": "clam-chowder", "title": "Clam Chowder", "time": "about 45 min", "ingredients": ["1½–2 sticks margarine", "2 medium onions", "2 cans whole baby clams", "2 cans minced or chopped clams", "Cooked diced potatoes (as many as you like)", "2 tbsp chicken bouillon", "Flour", "Salt and pepper", "About 1 quart milk"], "steps": ["Sauté the onions in the margarine until clear, not brown.", "Add flour a tablespoon at a time to make a roux, until the mixture pulls away from the sides of the pan.", "Stir constantly and cook 5 minutes.", "Add water (if using steamers, use the water the clams were steamed in) until the mixture is the consistency you want for chowder.", "Bring to a boil, stirring constantly. Simmer 5 minutes.", "Add the clams and their juice, the chicken bouillon, and the cooked potatoes. Season with salt and pepper.", "When ready to serve, add the milk and heat over medium heat. Do not boil."], "note": "From Jeanne: \"I usually halve the recipe 'cause it makes so much. Enjoy!\"", "course": "soup"}, {"id": "corn-clam-chourico-chowder", "title": "Corn Clam Chouriço Chowder", "time": "", "ingredients": ["Bacon or chouriço", "½ cup onion and celery, chopped", "1 tbsp butter", "3 tbsp flour", "1 can chicken stock", "Potatoes", "1 can corn", "2 tsp salt", "Pepper", "1½ cups Lactaid, or 1½ cups milk and 1½ cups heavy cream", "Clams"], "steps": ["Cook the bacon or chouriço in a large pot.", "Add ½ cup chopped onion and celery.", "Melt 1 tbsp butter.", "Add 3 tbsp flour and stir about 7 minutes.", "Add 1 can chicken stock and bring to a boil.", "Add in the potatoes, can of corn, 2 tsp salt, and pepper. Cover and simmer about 20 minutes, until the potatoes are tender.", "When the potatoes are tender, add 1½ cups of Lactaid, or 1½ cups milk and 1½ cups of heavy cream.", "Simmer for another 5 minutes and serve."], "note": "The page doesn't say when to add the clams.", "course": "soup", "pt": 1}, {"id": "cornbread", "title": "Cornbread", "time": "", "ingredients": ["½ cup melted butter", "⅔ cup sugar", "2 eggs", "½ tsp baking soda", "1 cup buttermilk", "1 cup cornmeal", "1 cup flour", "½ tsp salt"], "steps": ["Preheat to 375° and lightly grease a 9x9 pan.", "In a medium bowl, whisk ½ cup of melted butter and ⅔ cup sugar until smooth (60–90 seconds).", "Whisk in 2 eggs for about 30 seconds, until blended.", "Add in ½ teaspoon baking soda and stir.", "Slowly pour in 1 cup buttermilk while stirring.", "Add in 1 cup cornmeal, 1 cup flour, and ½ tsp salt and stir.", "Pour into the pan and bake 20 minutes, or until brown."], "note": "", "course": "side"}, {"id": "crab-meat-dish", "title": "Crab Meat Dish", "time": "", "ingredients": ["Olive oil", "½ onion, chopped", "3 garlic cloves, chopped", "1 package Goya (maybe another)", "½ package crab meat, chopped", "Hot sauce", "Chickpeas, olives, egg, potatoes, hot peppers, etc.", "Parsley"], "steps": ["Coat the pan with olive oil.", "Add ½ chopped onion, 3 chopped garlic cloves, and 1 package Goya. Sauté.", "Add ½ package chopped crab meat.", "Add hot sauce.", "Add more olive oil when dry.", "Add chickpeas, olives, egg, potatoes, hot peppers, etc.", "Maybe add another Goya. Garnish with parsley."], "note": "", "course": "dinner"}, {"id": "crabmeat-stuffing", "title": "Crabmeat Stuffing", "time": "", "ingredients": ["¾ roll of Ritz crackers", "¾ stick unsalted butter", "Hot sauce", "½ Goya packet", "Crabmeat", "Dash of black pepper"], "steps": ["Mix everything together and stuff the fish."], "note": "Serves 2 stuffed fish. The notebook lists ingredients only.", "course": "side"}, {"id": "crack", "title": "Crack", "time": "", "ingredients": ["1 sleeve of saltines", "1 cup unsalted butter", "1 cup brown sugar", "1 tsp vanilla extract", "Chocolate chips", "Toppings", "Nonstick spray"], "steps": ["Place foil on a baking sheet and spray with nonstick spray.", "Heat the oven to 350°.", "Lay a sleeve of saltines on the baking sheet.", "Boil 1 cup unsalted butter and 1 cup brown sugar over medium-high heat for 3 minutes.", "Stir in 1 tsp vanilla extract.", "Pour over the crackers.", "Bake 5 minutes, until bubbly.", "Sprinkle with chocolate chips and cover with foil for 5 minutes.", "Spread the chocolate and add toppings.", "Let rest for 2 hours, then crack.", "Keep cool."], "note": "Keep cool.", "course": "dessert"}, {"id": "cranberry-balsamic-pork-chops", "title": "Cranberry Balsamic Pork Chops", "time": "", "ingredients": ["Pork chops", "¼ cup balsamic vinegar", "1½ tsp olive oil", "1½ tsp mustard", "Salt and pepper", "Veggies of choice", "Cranberries", "Nonstick spray"], "steps": ["Heat the oven to 400° and spray a baking sheet with nonstick.", "In a small bowl, combine ¼ cup balsamic vinegar, 1½ tsp olive oil, and 1½ tsp mustard, and mix.", "Place the pork chops on the baking sheet and sprinkle with salt and pepper. Bake about 10 minutes.", "Drizzle the sauce over your desired veggies and the chops. Top with cranberries and bake about another 5 minutes."], "note": "", "course": "dinner"}, {"id": "cream-cheese-icing", "title": "Cream Cheese Icing", "time": "", "ingredients": ["16 oz powdered sugar", "1 package (8 oz) cream cheese, softened", "½ cup margarine, softened", "1 tsp vanilla"], "steps": ["Combine the powdered sugar, cream cheese, margarine, and vanilla in a medium bowl.", "Beat until smooth."], "note": "", "course": "extra"}, {"id": "creamy-cauliflower-soup", "title": "Creamy Cauliflower Soup", "time": "", "ingredients": ["2 tbsp butter", "1 tbsp oil", "½ onion, chopped", "2 stalks celery, chopped", "3 carrots, chopped", "1 head of cauliflower, chopped", "4 cloves garlic, minced", "1 tsp thyme", "1 tsp oregano", "2 tbsp cornstarch", "2 cups vegetable or chicken broth", "2 cups milk", "Salt and pepper"], "steps": ["Heat 2 tbsp butter and 1 tbsp oil in a pan.", "Add half an onion, 2 stalks celery, 3 carrots, and a head of cauliflower (all chopped).", "Add 4 cloves of minced garlic once the veggies are soft. Simmer 1 minute.", "Add 1 tsp thyme and oregano and 2 tbsp cornstarch, and cook 1 minute.", "Add 2 cups vegetable or chicken broth and 2 cups milk.", "Simmer 5 minutes, until thick. Add salt and pepper to taste."], "note": "", "course": "soup"}, {"id": "creamy-chicken-casserole", "title": "Creamy Chicken Casserole", "time": "", "ingredients": ["About 12 oz egg noodles", "¼ cup butter", "½ medium onion", "3 tsp minced garlic", "¼ cup flour", "2 cups chicken broth", "2 cups milk", "¼ tsp salt and black pepper", "2 cups frozen peas", "Cooked chicken", "2 cups cheddar cheese", "Ritz crackers", "¼ cup Parmesan cheese", "2–3 tsp olive oil"], "steps": ["Preheat the oven to 400°. Lightly grease a 9x13 pan.", "Cook about 12 oz egg noodles.", "Meanwhile, melt ¼ cup butter, add ½ medium onion, and sauté 5–7 minutes.", "Stir in 3 tsp minced garlic and ¼ cup flour. Cook 1 minute.", "Slowly whisk in 2 cups chicken broth and 2 cups milk.", "Add ¼ tsp salt and black pepper. Simmer until thick, about 5 minutes.", "Stir in 2 cups frozen peas, the cooked chicken, and 2 cups cheddar cheese.", "Turn off the heat. Put the pasta in the 9x13 pan and pour the cheese mixture over the pasta.", "In a small bowl, mix Ritz crackers, ¼ cup Parmesan cheese, and 2–3 tsp olive oil, then sprinkle over the top.", "Bake 15–20 minutes."], "note": "", "course": "dinner"}, {"id": "crispy-coconut-shrimp", "title": "Crispy Coconut Shrimp", "time": "", "ingredients": ["Shrimp", "½ cup flour", "1 tsp salt", "1 tsp pepper", "½ tsp garlic powder", "¼ tsp cayenne pepper", "2 eggs", "Breadcrumbs", "Coconut"], "steps": ["Set up 3 bowls. Bowl 1: ½ cup flour, 1 tsp salt, 1 tsp pepper, ½ tsp garlic powder, and ¼ tsp cayenne pepper. Bowl 2: 2 eggs. Bowl 3: breadcrumbs and coconut.", "Coat the shrimp in bowl 1, then bowl 2, then bowl 3.", "Air fry at 375° for 6–8 minutes, or until crispy."], "note": "", "course": "dinner"}, {"id": "crock-pot-bbq-ribs", "title": "Crock Pot BBQ Ribs", "time": "", "ingredients": ["Ribs", "BBQ sauce", "1 tbsp paprika", "1 tsp pepper", "1 tsp salt", "1 tsp garlic powder", "1 tsp onion powder", "1 tsp mustard powder"], "steps": ["Rub: mix 1 tbsp paprika, 1 tsp pepper, 1 tsp salt, 1 tsp garlic powder, 1 tsp onion powder, and 1 tsp mustard powder.", "Crockpot: add BBQ sauce, then the ribs, then BBQ sauce on top.", "Cook 8 hours on low."], "note": "", "course": "dinner"}, {"id": "croquettes", "title": "Croquettes", "time": "about 5 hrs with chilling", "ingredients": ["¼ cup butter or margarine (white sauce)", "¼ cup flour (white sauce)", "¼ tsp salt (white sauce)", "⅛ tsp pepper (white sauce)", "1 cup milk (white sauce)", "2 cups cooked meat, ground or finely chopped (beef, veal, pork, ham, chicken, or turkey)", "1 tbsp minced onion", "1 tsp snipped parsley", "Salt and pepper", "1 egg", "2 tbsp water", "¾ cup bread crumbs", "Fat or oil, for deep frying"], "steps": ["Make 1 cup thick white sauce: melt the butter in a saucepan over low heat. Blend in the flour, salt, and pepper and cook over low heat, stirring, until smooth and bubbly. Remove from the heat, stir in the milk, then heat to boiling, stirring constantly. Boil and stir 1 minute.", "Stir in the meat, minced onion, and parsley. Season with salt and pepper.", "Spread the mixture in an ungreased square pan. Cover and chill 2 to 3 hours.", "Divide the mixture and shape into croquettes.", "Beat the egg and water until blended. Dip each croquette in the egg, then roll in the bread crumbs until completely coated.", "Cover the croquettes and chill at least 2 hours.", "Heat fat or oil to 365° in a deep fryer or kettle. Fry the croquettes 1½ to 2 minutes, until light brown. Handle carefully so the crust doesn't break.", "Drain. Keep warm in a 350° oven until serving time."], "note": "Handwritten family recipe. A good way to use up leftover roast, ham, chicken, or turkey.", "course": "dinner"}, {"id": "dill-pickles", "title": "Dill Pickles", "time": "about 30 min", "ingredients": ["9 cups water", "3 cups white vinegar", "1 cup kosher salt", "Cucumbers", "1 clove garlic per jar", "1 tsp dill per jar", "½ tsp powdered alum per jar"], "steps": ["Bring the water, vinegar, and salt to a boil.", "Cut the cucumbers and pack them in jars.", "Top each jar with a clove of garlic, 1 tsp dill, and ½ tsp powdered alum.", "Pour the boiling liquid over and seal."], "note": "Handwritten family recipe. The card says \"a toe of garlic\", meaning one clove.", "course": "extra"}, {"id": "dirt-cake", "title": "Dirt Cake", "time": "", "ingredients": ["1 package of Oreos", "1 cream cheese", "1 Cool Whip", "2 vanilla puddings"], "steps": ["Break apart the Oreos. Scrape the cream off the middle.", "Blend the Oreos in a blender.", "Make the pudding.", "Mix the Oreo cream, cream cheese, vanilla pudding, and Cool Whip.", "Layer with crushed Oreos and the pudding mixture.", "Decorate with Cool Whip."], "note": "", "course": "dessert"}, {"id": "eggplant-parmesan", "title": "Eggplant Parmesan", "time": "", "ingredients": ["Eggplant(s)", "1 tsp salt", "1 cup flour", "¼ tsp black pepper", "2 large eggs", "1 cup Italian bread crumbs", "1 tsp garlic powder", "Marinara sauce", "Cheese (shredded, mozzarella, etc.)"], "steps": ["Slice the eggplant onto a baking sheet. Sprinkle with salt to remove moisture.", "Rinse after 1 hour.", "Get 3 bowls: 1 for flour and salt, another for 2 eggs, and another for breadcrumbs and garlic powder. Coat the eggplant.", "Cook on the baking sheet for 20 minutes at 400°. Flip halfway.", "Change the eggplant to cookware and layer with sauce and cheese. Put in the oven for 10 minutes."], "note": "", "course": "dinner"}, {"id": "fajita-style-veggie-tacos", "title": "Fajita Style Veggie Tacos", "time": "", "ingredients": ["Veggies", "Olive oil", "2 tsp lime juice", "1 tbsp taco seasoning", "Nonstick spray"], "steps": ["Heat the oven to 400° and spray a baking sheet. Place the veggies on the sheet and drizzle with olive oil, 2 tsp lime juice, and 1 tbsp taco seasoning.", "Bake about 20 minutes, tossing halfway through."], "note": "", "course": "dinner"}, {"id": "favas-guizadas", "title": "Favas Guizadas (Brown Ones)", "time": "", "ingredients": ["Favas (brown ones)", "Crushed pepper", "Garlic", "Salt", "Onion", "Olive oil", "Tomato", "Parsley", "Pepper"], "steps": ["Boil the favas with crushed pepper and garlic.", "Then add salt.", "Sauce: in a skillet, boil onion, olive oil, tomato, parsley, and pepper, and stir in the favas."], "note": "", "course": "side", "pt": 1}, {"id": "fish-tacos", "title": "Fish Tacos", "time": "", "ingredients": ["Fish fillets (cod, haddock, etc.)", "¼ tsp cayenne pepper", "1 tsp garlic", "½ tsp cumin", "½ tsp salt (fish)", "½ tsp pepper", "Oil", "3 cups cabbage (coleslaw)", "½ cup red onion (coleslaw)", "½ cup sour cream (coleslaw)", "½ cup mayo (coleslaw)", "2 tbsp lime juice (coleslaw)", "¼ tsp salt (coleslaw)"], "steps": ["Coleslaw: mix 3 cups cabbage, ½ cup red onion, ½ cup sour cream, ½ cup mayo, 2 tbsp lime juice, and ¼ tsp salt. Chill.", "Fish: mix ¼ tsp cayenne pepper, 1 tsp garlic, ½ tsp cumin, ½ tsp salt, and ½ tsp pepper, and rub on the fillets.", "Cook in oil on the stove top.", "Serve with beans, rice, guacamole, and cilantro."], "note": "Serve with beans, rice, guacamole, and cilantro.", "course": "dinner"}, {"id": "foolproof-dark-chocolate-fudge", "title": "Foolproof Dark Chocolate Fudge", "time": "15 min + 2 hrs chilling", "ingredients": ["3 cups semi-sweet chocolate chips (1½ 12-oz packages, Hershey's or Nestlé)", "1 can (14 oz) sweetened condensed milk", "Dash of salt", "1 cup chopped walnuts", "1½ tsp vanilla extract"], "steps": ["Line an 8 or 9 inch square pan with foil.", "In a saucepan over low heat, melt the chips with the sweetened condensed milk and salt.", "Remove from the heat. Stir in the walnuts and vanilla and spread evenly in the pan.", "Refrigerate 2 hours, until firm.", "Turn out onto a cutting board, peel off the foil, and cut into squares.", "Store loosely covered at room temperature."], "note": "From Lisa. Makes 5 dozen pieces.", "course": "dessert"}, {"id": "air-fryer-fried-fish", "title": "Fried Fish Air Fryer", "time": "", "ingredients": ["Fish", "Garlic powder", "Pepper", "Onion powder", "Paprika", "Flour", "Egg", "Breadcrumbs", "Nonstick spray"], "steps": ["Season the fish with garlic powder, pepper, onion powder, and paprika.", "Put in flour, then egg, then breadcrumbs.", "Spray the air fryer bottom with nonstick spray.", "Place the fish in and spray more.", "Air fry at 390° for about 13 minutes."], "note": "", "course": "dinner"}, {"id": "galinha-guizada-com-arroz", "title": "Galinha Guizada com Arroz", "time": "", "ingredients": ["Chicken", "Rice", "1 small onion", "1 can beer", "Water (fill the beer can twice)", "3 cloves garlic", "1 can tomato sauce", "Goya, for color (or paprika and salt)", "2 tsp red pepper", "½ chouriço (optional)"], "steps": ["Molho: combine a small onion, 1 can beer, 2 beer cans of water, 3 cloves garlic, 1 can tomato sauce, Goya for color, and 2 tsp red pepper. If there's no Goya, put in paprika and salt.", "Add the chicken to the pot.", "Cook the rice on the side.", "Add the rice to the pot.", "Optional: add ½ chouriço for flavor."], "note": "Feeds 2–3. No salt if Goya is used.", "course": "dinner", "pt": 1}, {"id": "galinha-mocambique", "title": "Galinha Moçambique", "time": "", "ingredients": ["24 oz galinha", "½ onion (cebola)", "2 tbsp alho picado", "4 tbsp manteiga", "2 pacotes de Goya", "12 oz cerveja", "4 oz pimenta", "Salsa picada", "1 limão inteiro"], "steps": ["Stir (refogue) a galinha em duas colheres de sopa de manteiga até ficar cozido.", "Retire da frigideira.", "Refogue as cebolas e alho com outras duas colheres de sopa de manteiga.", "Mete cerveja na panela e ponha-se a galinha na panela.", "Adicione o molho quente e deixe cozinhar por 2–3 minutos, mexendo ocasionalmente.", "Adicione os restos dos ingredientes e deixe ferver um minuto.", "Sirve com arroz ou batatas fritas ou massas."], "note": "", "course": "dinner", "pt": 1}, {"id": "garlic-lime-skillet-chicken", "title": "Garlic Lime Skillet Chicken", "time": "", "ingredients": ["Chicken breasts or thighs (about 4)", "1 tsp garlic powder", "¾ tsp salt", "½ tsp paprika", "½ tsp dried parsley", "¼ tsp pepper", "¼ tsp cayenne pepper", "2 tbsp butter", "2 tbsp extra virgin olive oil", "4 tbsp lime juice (2 limes)", "4 or 5 cloves garlic, chopped", "Cilantro"], "steps": ["Mix 1 tsp garlic powder, ¾ tsp salt, ½ tsp paprika, ½ tsp dried parsley, ¼ tsp pepper, and ¼ tsp cayenne pepper in a small bowl.", "Rub onto the chicken (about 4 pieces).", "Melt 2 tbsp butter and 2 tbsp extra virgin olive oil on medium-high.", "Reduce the heat to medium and add the chicken.", "When about cooked, add 4 tbsp of lime juice (2 limes).", "Add 4 or 5 chopped cloves of garlic in an empty spot in the pan and sauté for about 1 minute.", "Spoon the broth onto the chicken and serve. Add cilantro."], "note": "The page says chicken breasts in one step and chicken thighs in another.", "course": "dinner"}, {"id": "garlic-parm-cauliflower", "title": "Garlic Parm Cauliflower", "time": "", "ingredients": ["Cauliflower", "About 3–4 cloves garlic", "Extra virgin olive oil", "Grated or shredded Parmesan cheese"], "steps": ["Cut up the cauliflower into bite sized pieces.", "Spread out on a sheet pan.", "Cut up about 3–4 cloves of garlic.", "Drizzle extra virgin olive oil on top.", "Bake at 400° for 25 minutes.", "Melt grated or shredded Parmesan cheese on top."], "note": "", "course": "side"}, {"id": "graham-cracker-crust", "title": "Graham Cracker Crust", "time": "", "ingredients": ["1½ cups graham cracker crumbs", "2 tbsp sugar", "1 tbsp brown sugar", "7 tbsp melted butter"], "steps": ["Mix the graham cracker crumbs, sugar, brown sugar, and melted butter and press into a pan.", "Bake at 375° for 7–10 minutes."], "note": "", "course": "extra"}, {"id": "grandmothers-spinach-souffle", "title": "Grandmother's Spinach Soufflé", "time": "about 50 min", "ingredients": ["2 packages frozen chopped spinach, thawed", "3 eggs, beaten", "½ cup or so cubed cheese"], "steps": ["Add everything together and stir.", "Cover and set the dish in a water bath.", "Bake at 325° until set, about 40–45 minutes."], "note": "Grandmother's recipe, from a Christmas card.", "course": "side"}, {"id": "greek-pita-pizzas", "title": "Greek Pita Pizzas", "time": "30 min", "ingredients": ["4 tbsp extra-virgin olive oil", "4 pita breads (8 inch)", "2 tbsp red wine vinegar", "Salt and pepper", "1 small red onion, sliced thin", "½ cup pitted kalamata olives, chopped", "½ cup hummus (red pepper works well)", "1 cup shredded Italian cheese blend", "1 cup crumbled feta cheese", "2 cups arugula"], "steps": ["Set the oven rack in the middle and heat the oven to 475°. Brush 2 tbsp of the oil over the tops and bottoms of the pitas. Bake on a baking sheet until golden, about 5 minutes.", "Meanwhile, whisk the remaining 2 tbsp oil, the vinegar, and salt and pepper to taste. In a separate bowl, toss the onion and olives with 2 tbsp of this vinaigrette.", "Spread 2 tbsp hummus on each toasted pita. Sprinkle the cheeses over the hummus, then top with the onion mixture.", "Bake until the onions soften and the cheese melts, 6 to 8 minutes.", "Just before serving, toss the arugula with the remaining vinaigrette and pile it on top."], "note": "Serves 4. Per serving: 550 calories, 19g protein, 42g carbs, 5g fiber, 1,220mg sodium. Serve with a tomato salad. From Shaw's and America's Test Kitchen.", "course": "dinner"}, {"id": "grilled-pineapple", "title": "Grilled Pineapple", "time": "", "ingredients": ["1 pineapple", "½ cup brown sugar", "1 tsp cinnamon", "Nonstick spray"], "steps": ["Cut off the crown and the bottom of the pineapple.", "Cut the sides until there are no eyes.", "Cut in half and then in half again to make 4 parts.", "Trim the stalk because it's fibrous.", "Cut each one in half to make 8 spears.", "Coat in ½ cup brown sugar and 1 tsp cinnamon.", "Preheat an outdoor grill to medium-high.", "Carefully spray nonstick on the grates.", "Cook 3 minutes per side."], "note": "", "course": "side"}, {"id": "grilled-shrimp", "title": "Grilled Shrimp", "time": "", "ingredients": ["Jumbo shrimp, peeled", "2 tbsp lemon juice", "2 tbsp extra virgin olive oil", "1 tbsp paprika", "1 tsp garlic powder", "1 tsp onion powder", "1 tsp basil", "1 tsp oregano", "½ tsp salt", "½ tsp pepper", "¼ tsp cayenne pepper", "Wooden sticks (if the shrimp are small)"], "steps": ["Combine the peeled jumbo shrimp with 2 tbsp lemon juice, 2 tbsp extra virgin olive oil, 1 tbsp paprika, 1 tsp each of garlic powder, onion powder, basil, and oregano, ½ tsp each of salt and pepper, and ¼ tsp cayenne pepper.", "If the shrimp are small, soak wooden sticks in water.", "Cook 3 minutes each side, or until not see through."], "note": "", "course": "dinner"}, {"id": "homemade-caesar-dressing", "title": "Homemade Caesar Dressing", "time": "", "ingredients": ["2 small garlic cloves, minced", "1 tsp anchovy paste", "2 tbsp lemon juice", "1 tsp Dijon mustard", "1 tsp Worcestershire sauce", "1 cup mayo", "½ cup grated Parmesan cheese", "¼ tsp salt and pepper"], "steps": ["Whisk everything together."], "note": "The notebook lists ingredients only.", "course": "extra"}, {"id": "honey-garlic-shrimp", "title": "Honey Garlic Shrimp", "time": "", "ingredients": ["Shrimp", "¼ cup honey", "2 tbsp soy sauce", "1 tbsp olive oil (sauce)", "2 tbsp minced garlic", "1 tbsp white vinegar", "1 tsp red pepper", "1 tbsp olive oil (pan)"], "steps": ["In a small bowl, whisk together ¼ cup honey, 2 tbsp soy sauce, 1 tbsp olive oil, 2 tbsp minced garlic, 1 tbsp white vinegar, and 1 tsp red pepper for the sauce.", "Marinate the shrimp 15–20 minutes.", "Heat 1 tbsp olive oil in a pan and, once heated, add the shrimp.", "Serve with rice, pasta, snap peas, broccoli, etc."], "note": "Serve with rice, pasta, snap peas, broccoli, etc.", "course": "dinner"}, {"id": "irvilhas-guizadas", "title": "Irvilhas Guizadas", "time": "", "ingredients": ["3 cups water", "Onion", "1 can tomato sauce (plus 1 or 2 more if needed)", "Salt and pepper", "Linguiça", "Peas", "Chicken", "2 beers", "Diced potatoes"], "steps": ["With 3 cups of water, take the onion, one can of tomato sauce, salt, pepper, and linguiça, and sauté for ½ hour.", "Add the peas to the sauce for 20 minutes.", "Add the chicken and 2 beers and cook in the sauce for 15 minutes.", "Add the diced potatoes and cook until the potatoes are done.", "If the gravy looks whitish, add one or two more cans of tomato sauce."], "note": "If the gravy looks whitish, add one or two more cans of tomato sauce.", "course": "side", "pt": 1}, {"id": "italian-meat-loaf", "title": "Italian Meat Loaf", "time": "", "ingredients": ["1½ lbs ground beef", "1 cup Italian bread crumbs", "¾ cup chopped onion", "1 can (8 oz) tomato sauce", "2 eggs, lightly beaten", "1¼ teaspoons salt", "Shredded mozzarella cheese"], "steps": ["Preheat the oven to 350°.", "In a large bowl, combine the beef, bread crumbs, onion, tomato sauce, eggs, and salt.", "Mix until the ingredients are blended.", "In a shallow baking pan, shape the meat mixture into a 9x5x3 inch loaf.", "Bake until the loaf is cooked (45–50 minutes).", "Sprinkle with shredded mozzarella cheese and melt."], "note": "", "course": "dinner"}, {"id": "jalapeno-popper-meatballs", "title": "Jalapeño Pepper Popper Meatballs", "time": "", "ingredients": ["Ground beef", "½ onion, chopped", "Jalapeños, chopped", "¾ cup bread crumbs", "½ cup cheddar", "⅓ cup milk", "2 tbsp Worcestershire sauce", "1 tsp basil", "1 tsp salt", "Cream cheese", "Garlic powder (optional)"], "steps": ["Preheat the oven to 400° and lightly grease a sheet.", "In a large bowl, combine the ground beef, ½ chopped onion, chopped jalapeños, ¾ cup bread crumbs, ½ cup cheddar, ⅓ cup milk, 2 tbsp Worcestershire sauce, 1 tsp basil, and 1 tsp salt, and mix by hand.", "Precut small pieces of cream cheese.", "Shape the meat into balls, then flatten, add a piece of cream cheese, and roll it back up.", "Cook 25–30 minutes."], "note": "Serve over pasta or in a sandwich. Add garlic powder for extra taste.", "course": "dinner"}, {"id": "jalapeno-popper-stuffed-french-bread", "title": "Jalapeño Popper Stuffed French Bread", "time": "", "ingredients": ["1 loaf French bread", "8 oz cream cheese, softened", "¼ cup mayo", "1 cup cheddar", "Bacon", "3 jalapeños, minced"], "steps": ["Slice the French bread in half.", "Scoop out the bread, leaving only the crust. Chop the scooped bread into small pieces.", "In a large mixing bowl, mix 8 oz softened cream cheese, ¼ cup mayo, 1 cup cheddar, bacon, and 3 minced jalapeños.", "Scoop the mixture into the bread and top it with the other half.", "Bake at 375° for 15–20 minutes."], "note": "", "course": "side"}, {"id": "key-lime-dip", "title": "Key Lime Dip", "time": "", "ingredients": ["1 cup cream cheese", "1 can sweetened condensed milk", "3 cups Cool Whip", "⅓ cup lime juice, from limes", "Zest of 2 key limes", "Fruit, graham crackers, or Nilla wafers, for serving"], "steps": ["Beat the cream cheese and condensed milk until creamy.", "Add the lime juice and zest. Beat until fluffy and smooth, 2–3 minutes.", "Add the Cool Whip and mix.", "Serve cold with fruit, graham crackers, or Nilla wafers."], "note": "", "course": "dessert"}, {"id": "kfc-coleslaw", "title": "KFC Coleslaw", "time": "10 min + 2 hrs chilling", "ingredients": ["8 cups cabbage, finely chopped (about 1 head)", "¼ cup shredded carrot (about 1 carrot)", "2 tbsp minced onion", "⅓ cup sugar", "½ cup mayonnaise", "¼ cup buttermilk", "¼ cup milk", "2½ tbsp lemon juice", "1½ tbsp white vinegar", "½ tsp salt", "½ tsp pepper"], "steps": ["In a large bowl, mix the milk, buttermilk, mayonnaise, sugar, lemon juice, and vinegar.", "Add the onion, carrot, and cabbage with the salt and pepper. Toss to coat the vegetables in the dressing.", "Cover and chill at least 2 hours (up to 8) before serving."], "note": "Side dish. Serves 12. From Love From The Oven.", "course": "side"}, {"id": "lisas-mushrooms", "title": "Lisa's Mushrooms", "time": "about 30 min", "ingredients": ["1 package mushrooms", "¼ cup margarine", "½ cup minced onion", "Garlic", "¼ lb sausage", "½ cup Italian bread crumbs (Progresso)"], "steps": ["Remove the mushroom stems and chop them fine.", "Melt the margarine and sauté the chopped stems and onion until well cooked. Sprinkle with garlic.", "Cook the sausage, drain, and add it to the mixture.", "Mix in the bread crumbs.", "Fill the mushroom caps and bake at 350° for 10–15 minutes."], "note": "From Lisa. The card doesn't say to fill the caps, but that's what the stems-removed caps are for.", "course": "side"}, {"id": "low-carb-crack-slaw", "title": "Low Carb Crack Slaw", "time": "35 min", "ingredients": ["1 lb lean ground beef (or ground chicken or turkey)", "4 cloves garlic, minced", "2 tbsp sesame oil", "6–7 cups coleslaw mix", "1–2 tbsp sriracha", "2 tbsp soy sauce", "2 tsp white vinegar", "½ tsp sugar (or Splenda for low carb)", "½ tsp salt", "½ tsp pepper", "1 tsp toasted sesame seeds", "2–3 tbsp green onion, chopped"], "steps": ["In a large skillet, cook the ground beef until no longer pink. Drain and return to the stove.", "Push the beef to the side, add the sesame oil to the open space, and fry the garlic 2–3 minutes. Mix it into the beef.", "Add the coleslaw mix. Drizzle with the sriracha, vinegar, and soy sauce, and sprinkle with the sugar, salt, and pepper. Cook about 5 minutes, until the cabbage is wilted to your liking.", "Plate and sprinkle with the sesame seeds and green onions."], "note": "Serves 4, about 255 calories each. From The Kitchen Magpie.", "course": "dinner"}, {"id": "lush", "title": "Lush", "time": "", "ingredients": ["1½ sticks margarine (crust)", "1½ cups flour (crust)", "½ cup chopped nuts (crust)", "1 package (8 oz) cream cheese, softened", "1 cup confectioners sugar", "1 cup Cool Whip (cheese filling)", "2 packages instant pudding (pistachio)", "3 cups milk", "Cool Whip and nuts, for the top"], "steps": ["Crust: blend the margarine, flour, and chopped nuts with a fork and press into a 13x9 pan.", "Bake at 350° for 20–30 minutes, till light brown. Cool.", "Cheese filling: beat the cream cheese and sugar.", "Beat in the Cool Whip and spread on the crust.", "Pudding filling: beat the instant pudding and 3 cups milk until thick, and spread over the cream cheese.", "Top with Cool Whip and nuts."], "note": "", "course": "dessert"}, {"id": "macaroni-salad", "title": "Macaroni Salad", "time": "", "ingredients": ["Macaroni", "1 cup onions", "1 cup green pepper", "Some pimento", "Some salt and white pepper", "A little apple cider vinegar", "Mayo", "1
