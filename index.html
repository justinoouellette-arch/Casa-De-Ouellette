 cup celery"], "steps": ["Cook the macaroni.", "Add the onions, pepper, and pimento.", "Add salt, white pepper, and a little apple cider vinegar.", "Mix. Add the mayo and celery and mix.", "Serve cold."], "note": "", "course": "side"}, {"id": "margarita-grilled-chicken", "title": "Margarita Grilled Chicken", "time": "", "ingredients": ["Chicken", "¼ cup finely chopped cilantro", "1 tsp black pepper", "1 tsp garlic powder", "1 tsp salt", "1 cup margarita mix", "1 tbsp sugar", "¼ cup olive oil"], "steps": ["Marinade: whisk together ¼ cup finely chopped cilantro, 1 tsp black pepper, 1 tsp garlic powder, 1 tsp salt, 1 cup margarita mix, 1 tbsp sugar, and ¼ cup olive oil.", "Marinate the chicken for about 2+ hours.", "Grill over medium-high heat, 7 minutes per side."], "note": "", "course": "dinner"}, {"id": "meatballs-and-sauce", "title": "Meatballs and Sauce", "time": "", "ingredients": ["1 pound hamburg", "1 egg", "Italian bread crumbs", "Salt, pepper, garlic, oregano (meatballs)", "Ragu or Prego (sauce)", "1 small can tomato paste (sauce)", "1 big can tomato sauce (sauce)", "Salt, pepper, garlic powder, oregano (sauce)", "Water"], "steps": ["Meatballs: combine the hamburg and egg, sprinkle in some Italian bread crumbs, and add salt, pepper, garlic, and oregano.", "Mix the ingredients and form the meatballs.", "Place them in the oven until a little brown.", "Sauce: place the tomato paste in a pot with a little bit of water until the paste is dissolved.", "Add the tomato sauce and Ragu or Prego.", "Add the rest of the sauce ingredients and cook over a low flame.", "Place the meatballs in the sauce on a low flame."], "note": "", "course": "dinner"}, {"id": "meatless-burrito-bowl", "title": "Meatless Burrito Bowl", "time": "", "ingredients": ["1 head of cauliflower", "Peppers", "Beans", "Corn", "Lime juice", "Taco seasoning", "Cheese"], "steps": ["Chop a head of cauliflower to look like rice and sauté in a pan.", "Add peppers, beans, and corn and sauté more until lightly brown and “mushy”.", "Sprinkle with lime juice.", "Add taco seasoning.", "Add cheese."], "note": "", "course": "dinner"}, {"id": "meatloaf", "title": "Meatloaf (Stay at Home Chef)", "time": "", "ingredients": ["2 lbs ground beef", "1 cup unseasoned breadcrumbs (seasoned works fine too)", "Half an onion, diced", "½ cup milk", "2 tbsp Worcestershire sauce", "1 egg", "1 tsp dried basil", "1 tsp dried oregano", "1 tsp salt", "½ tsp black pepper", "½ tsp red pepper flakes (optional)", "½ cup ketchup (glaze)", "2 tbsp brown sugar (glaze)", "1 tbsp Worcestershire sauce (glaze)"], "steps": ["Add the ground beef (2 lbs), 1 cup of unseasoned breadcrumbs (seasoned worked fine too), half a diced onion, ½ cup of milk, 2 tbsp Worcestershire sauce, and 1 egg. Add the seasonings: 1 tsp dried basil, 1 tsp dried oregano, 1 tsp salt, ½ tsp black pepper, and ½ tsp red pepper flakes (optional).", "Mix together with your hands.", "Transfer to a lightly greased 9x13 pan, squish it all together, and shape into a loaf (this pan allows grease to escape).", "Bake at 350° for 45 minutes.", "Glaze: mix ½ cup ketchup, 2 tbsp brown sugar, and 1 tbsp Worcestershire sauce.", "Drizzle the glaze on the meatloaf after 45 minutes.", "Return to the oven at 400° for 15 minutes."], "note": "", "course": "dinner"}, {"id": "mexican-meatloaf", "title": "Mexican Meatloaf", "time": "", "ingredients": ["Ground beef", "1 cup crushed tortilla chips", "¾ cup cheese of choice", "1 small onion, chopped", "1 taco seasoning mix", "2 eggs, beaten", "½ cup milk", "¼ cup taco sauce or salsa"], "steps": ["Preheat to 350°.", "Combine the beef, chips, cheese, onion, and seasoning.", "Whisk the eggs, milk, and taco sauce or salsa, and stir into the meat mixture until well combined.", "Put in a loaf pan. Cook 45–60 minutes."], "note": "", "course": "dinner"}, {"id": "mexican-skillet-steak", "title": "Mexican Skillet Steak", "time": "", "ingredients": ["Flank steak (or another type of steak)", "½ cup orange juice", "¼ cup lime juice", "1 tbsp white vinegar", "1 tbsp extra virgin olive oil", "1 or 2 tbsp chopped jalapeño", "4 cloves garlic, crushed", "½ tsp salt", "¼ tsp black pepper"], "steps": ["Marinade: whisk together ½ cup orange juice, ¼ cup lime juice, 1 tbsp white vinegar, 1 tbsp extra virgin olive oil, 1 or 2 tbsp chopped jalapeño, 4 cloves crushed garlic, ½ tsp salt, and ¼ tsp black pepper.", "Put the flank (or another type of steak) in a shallow dish and pour the marinade over.", "Refrigerate 30–60 minutes.", "Sear for about 5–10 minutes each side."], "note": "", "course": "dinner"}, {"id": "mexican-street-corn-soup", "title": "Mexican Street Corn Soup", "time": "", "ingredients": ["4 tbsp butter", "1 small onion, chopped", "1 jalapeño, chopped", "5 cloves garlic, minced", "3 tbsp flour", "2 tsp cumin", "1 tsp chili powder", "4 cups chicken stock", "6 cups frozen corn kernels", "1 tbsp sugar", "2 tsp salt", "1½ cups heavy cream or milk", "1 cup fresh cilantro", "Bacon (optional)", "Cotija cheese (optional)", "1 jalapeño (optional)"], "steps": ["Melt 4 tbsp butter over medium heat.", "Add 1 small chopped onion and 1 chopped jalapeño. Cook about 5 minutes.", "Add 5 cloves minced garlic and cook about 1 minute.", "Stir in 3 tbsp flour, 2 tsp cumin, and 1 tsp chili powder. Stir 1–2 minutes.", "Pour in 4 cups chicken stock.", "Add 6 cups frozen corn kernels, 1 tbsp sugar, and 2 tsp salt. Return to a boil, then reduce to low. Simmer 10 minutes.", "Stir in 1½ cups heavy cream or milk and 1 cup fresh cilantro.", "Optional: top with bacon, cotija cheese, and 1 jalapeño."], "note": "Optional toppings: bacon, cotija cheese, and 1 jalapeño.", "course": "soup"}, {"id": "midori-colada", "title": "Midori Colada", "time": "", "ingredients": ["2 cups pineapple juice", "6 oz Midori", "7 oz Coco Lopez", "4 oz rum", "1 tray ice"], "steps": ["Mix in a blender and serve."], "note": "", "course": "extra"}, {"id": "mississippi-pot-roast", "title": "Mississippi Pot Roast", "time": "", "ingredients": ["Roast", "2 tbsp vegetable oil", "½ cup beef broth", "¼ cup pepperoncini juice", "6–10 pepperoncini peppers", "2 tbsp ranch seasoning", "1 tbsp onion powder", "½ cup butter (less if wanted)"], "steps": ["Pour 2 tbsp vegetable oil in a pan on medium-high heat (skip if using a crockpot).", "Sear the roast on both sides, 3–4 minutes (skip if using a crockpot).", "Pour in ½ cup beef broth.", "Add ¼ cup pepperoncini juice.", "Toss in half a dozen to 10 pepperoncini peppers.", "Sprinkle with 2 tbsp ranch seasoning.", "Sprinkle with 1 tbsp onion powder.", "Put ½ cup butter (less if wanted) on top of the roast.", "Oven: 350° for 3 hours. Crockpot: low for 8 hours."], "note": "", "course": "dinner"}, {"id": "molho-de-feijao", "title": "Molho de Feijão", "time": "", "ingredients": ["1 cebola", "2 dentes (cloves) de alho", "1 lata de tomato sauce", "2 latas de água", "4 batatas picadas", "1 chouriço, cut small", "1 cerveja", "2 colheres de macarrão", "1 lata de feijão vermelho", "Sal e pimenta", "Pouco de colorau"], "steps": ["Pica uma cebola com 2 dentes (cloves) de alho e refoga (sauté) com uma lata de tomato sauce e duas latas de água.", "Meta 4 batatas picadas, um chouriço cut small, e uma cerveja.", "Adicione 2 colheres de macarrão e uma lata de feijão vermelho.", "Sal e pimenta, pouco de colorau.", "Mete mais água se está seco e vai provando."], "note": "", "course": "side", "pt": 1}, {"id": "moms-lasagna", "title": "Mom's Lasagna", "time": "about 5 hrs (3½ hr simmer)", "ingredients": ["½ lb ground beef", "½ lb Johnsonville mild Italian sausage, ground", "1 large onion, chopped", "3 garlic cloves, minced", "1 can (28 oz) crushed tomatoes, undrained", "1 can (6 oz) tomato paste", "1½ cups water", "1 cup salsa", "2 tsp sugar", "1–2 tsp chili powder", "1 tsp fennel seed", "1 tsp dried oregano", "1 tsp dried basil", "9 lasagna noodles", "1 carton (16 oz) 4% cottage cheese", "4 cups shredded part-skim mozzarella cheese", "¾ cup grated Parmesan cheese"], "steps": ["In a large kettle or Dutch oven, cook the beef, sausage, and onion until the meat is no longer pink and the onion is tender. Drain.", "Stir in the garlic, crushed tomatoes, tomato paste, water, salsa, sugar, chili powder, fennel, oregano, and basil. Bring to a boil, then reduce the heat and simmer uncovered for 3 hours, stirring occasionally.", "Meanwhile, cook the noodles according to the package. Drain and rinse in cold water.", "In a greased 13x9 baking dish, layer a third of the noodles and meat sauce, half of the cottage cheese, and a third of the mozzarella and Parmesan. Repeat. Top with the remaining noodles, meat sauce, mozzarella, and Parmesan.", "Cover and bake at 350° for 45 minutes. Uncover and bake 20 minutes more, until bubbly.", "Let stand 15 minutes before cutting."], "note": "Serves 12. Per piece: 335 calories, 24g protein, 27g carbs, 4g fiber. From Taste of Home.", "course": "dinner"}, {"id": "steakhouse-creamed-spinach", "title": "Morton's Steakhouse Creamed Spinach", "time": "35 min", "ingredients": ["4 tbsp unsalted butter", "1 medium yellow onion, minced", "3 cloves garlic, minced", "4 tsp kosher salt, divided", "1 tsp coarse ground black pepper", "½ tsp nutmeg, freshly grated", "¼ cup flour", "3½ cups half and half", "2¼ lbs fresh leaf spinach (or 1 lb frozen)", "1 cup mozzarella cheese", "4 oz cream cheese", "½ cup Parmesan cheese, grated"], "steps": ["Bring a large pot of water to a boil with 2 tsp of the salt.", "Add the spinach and cook just until wilted, about 1 minute.", "Drain the spinach in a strainer or colander.", "Rinse with cold water until cool and squeeze the water out of each fistful of spinach.", "Chop the spinach bundles into ¾ inch widths.", "In a large skillet, melt the butter with the garlic and onion.", "Cook on medium-low for 8–10 minutes, until the onion is translucent.", "Add the remaining salt, the pepper, and the nutmeg.", "Add the flour and stir with a wooden spoon over low heat for 2–3 minutes, until the aroma is a bit nutty.", "Add the half and half and cook until boiling.", "Add the mozzarella and cream cheese.", "Cook 6–8 minutes, until the mixture has thickened.", "Add the spinach and Parmesan and stir to combine."], "note": "Side dish. Serves 8. From Dinner then Dessert.", "course": "side"}, {"id": "octopus-stew", "title": "Octopus Stew", "time": "", "ingredients": ["Octopus", "Olive oil", "Parsley", "Garlic", "Onion", "Red crushed pepper", "Paprika", "½ stick butter, cut in slices", "Potatoes", "Small cup of red wine"], "steps": ["Wash, clean, and chop the octopus.", "In a pan, put the octopus with olive oil, parsley, garlic, onion, red crushed pepper, paprika, and ½ stick butter cut in slices.", "Put it all in the oven.", "When it's almost done, add the potatoes and a small cup of red wine."], "note": "The page gives no oven temperature or time.", "course": "soup", "pt": 1}, {"id": "onion-roasted-chicken-and-vegetables", "title": "Onion Roasted Chicken + Vegetables", "time": "about 45 min", "ingredients": ["1 envelope onion soup mix", "¼ cup olive oil", "4 boneless chicken breast halves", "½ tsp garlic powder", "2 carrots, sliced", "2 medium potatoes, cut in small chunks"], "steps": ["Heat the oven to 450°.", "In a bowl, mix all the ingredients and evenly coat.", "In a 13x9 pan, arrange the chicken and veggies.", "Bake uncovered for 45 minutes, basting halfway through (put the molho over the chicken so it doesn't get dry).", "Bake until the chicken and vegetables are tender."], "note": "", "course": "dinner"}, {"id": "pan-seared-lemon-dill-salmon", "title": "Pan-Seared Lemon & Dill Salmon", "time": "", "ingredients": ["Green beans", "2 tbsp water", "Salmon", "¼ tsp salt and pepper", "2 tbsp butter", "1 tbsp lemon juice", "1 tbsp fresh dill", "2 tsp chopped garlic"], "steps": ["Heat a skillet over medium-high heat. Add green beans and 2 tbsp water, cover, and cook about 4 minutes.", "Add the salmon and ¼ tsp salt and pepper. Cook about 4 minutes per side and set aside on a plate.", "Reduce the heat to low. Add 2 tbsp butter, 1 tbsp lemon juice, 1 tbsp fresh dill, and 2 tsp chopped garlic. Cook about 1 minute and spoon over the salmon and green beans."], "note": "", "course": "dinner"}, {"id": "parmesan-crusted-chicken", "title": "Parmesan Crusted Chicken", "time": "", "ingredients": ["Chicken", "1 egg", "Salt", "Black pepper", "Garlic powder", "Onion powder", "Italian seasoning", "Flour", "Bread crumbs", "Parmesan cheese", "Butter", "Olive oil", "Pasta, vegetables, and marinara sauce, for serving"], "steps": ["Bowl 1: 1 egg with salt, black pepper, garlic powder, onion powder, and Italian seasoning.", "Bowl 2: flour, bread crumbs, and Parmesan cheese.", "Melt butter and olive oil in a pan.", "Add the chicken, breaded from both bowl mixtures, into the pan (3–4 minutes each side). If still pink, cook on low.", "Serve with pasta and vegetables in a marinara sauce."], "note": "If still pink, cook on low.", "course": "dinner"}, {"id": "pasta-fagioli-soup", "title": "Pasta Fagioli Soup", "time": "", "ingredients": ["1 tbsp olive oil", "1 pound ground beef", "2 carrots, diced", "3 celery stalks, diced", "1 medium onion, diced", "28 oz can crushed tomatoes", "30 oz beef broth", "2 whole bay leaves", "1 tsp oregano", "1 tsp basil", "½ tsp thyme", "1 can white cannellini beans", "1 can kidney beans", "1 cup ditalini pasta", "1 tsp salt", "1 tsp pepper", "Parmesan cheese", "Bread"], "steps": ["Cook the hamburg in a pan.", "Add all the ingredients except the beans and pasta.", "Bring to a boil.", "Add the beans and pasta.", "Add Parmesan cheese and serve with bread."], "note": "", "course": "soup"}, {"id": "peanut-butter-bars", "title": "Peanut Butter Bars", "time": "about 1 hr", "ingredients": ["1 cup crunchy peanut butter", "⅔ cup butter or margarine, softened", "1 tsp vanilla", "2 cups light brown sugar, firmly packed", "3 eggs", "1 cup sifted all-purpose flour", "½ tsp salt", "¾ cup sifted confectioners sugar", "2 tsp water", "¼ cup semisweet chocolate pieces", "1 tsp vegetable shortening"], "steps": ["Beat the peanut butter, butter, and vanilla in a large bowl with an electric mixer until well blended. Beat in the brown sugar until light and fluffy, then the eggs one at a time.", "Stir in the flour and salt just until blended. Spread the batter in a greased 13x9x2 inch pan.", "Bake at 350° for 35 minutes, until the center springs back when lightly touched. Cool slightly on a wire rack.", "Stir the confectioners sugar and water until smooth. Drizzle over the still-warm bars and spread with the back of a spoon.", "Melt the chocolate with the shortening over simmering water (or in the microwave). Drizzle over the white glaze for a black and white pattern.", "When cool, cut into 36 rectangles with a sharp knife and lift out with a spatula."], "note": "Handwritten family recipe. Makes 36 bars.", "course": "dessert"}, {"id": "pecan-cornbread-stuffing", "title": "Pecan-Cornbread Stuffing", "time": "", "ingredients": ["3 cups water", "½ cup butter", "16 oz cornbread mix", "About 10 strips bacon", "1 cup chopped celery", "½ cup onions", "½ cup chopped pecans", "½ tsp salt", "¼ tsp pepper"], "steps": ["Bring 3 cups water and ½ cup butter to a boil.", "Remove from the heat and add 16 oz cornbread mix. Cover and set aside.", "In a skillet, cook about 10 strips of bacon. Drain on a paper towel.", "Cook 1 cup chopped celery and ½ cup onions in the bacon drippings. Add to the cornbread mixture with the chopped bacon.", "Add ½ cup chopped pecans, ½ tsp salt, and ¼ tsp pepper.", "Put in a greased baking dish and bake at 325° for about 45 minutes."], "note": "", "course": "side"}, {"id": "penne-rosa", "title": "Penne Rosa", "time": "", "ingredients": ["Penne", "1 tbsp olive oil", "8 oz sliced mushrooms", "2 tbsp minced garlic", "1½ cups marinara sauce", "¼ tsp red pepper flakes", "4 medium Roma tomatoes, diced", "3 cups baby spinach", "½ cup heavy cream", "Salt and pepper", "½ cup Parmesan cheese"], "steps": ["Boil the penne.", "Heat 1 tbsp olive oil over medium-high heat and add 8 oz sliced mushrooms. Cook 3–4 minutes.", "Add 2 tbsp minced garlic and cook 1 minute.", "Stir in the cooked penne, 1½ cups marinara sauce, and ¼ tsp red pepper flakes. Cook 2–3 minutes.", "Add 4 medium diced Roma tomatoes and 3 cups baby spinach. Cook 2 minutes.", "Pour in ½ cup heavy cream and season with salt and pepper.", "Add ½ cup Parmesan cheese."], "note": "", "course": "dinner"}, {"id": "pesto", "title": "Pesto", "time": "", "ingredients": ["2 cups loosely packed fresh basil", "3 whole garlic cloves", "½ cup Parmesan cheese", "⅓ cup olive oil", "¼ cup pine nuts (or sunflower seeds, walnuts, almonds, or pecans)"], "steps": ["Blend 2 cups loosely packed fresh basil, 3 whole garlic cloves, ½ cup Parmesan cheese, ⅓ cup olive oil, and ¼ cup pine nuts (or sunflower seeds, walnuts, almonds, or pecans)."], "note": "Good in the fridge for 3–5 days, or freeze for 6 months.", "course": "extra"}, {"id": "pico-de-gallo", "title": "Pico de Gallo", "time": "", "ingredients": ["Tomatoes", "Red onion", "2 tbsp cilantro", "Jalapeño pieces", "2 tbsp lime juice"], "steps": ["Chop the tomatoes.", "Add red onion, 2 tbsp cilantro, jalapeño pieces, and 2 tbsp lime juice.", "Toss together."], "note": "", "course": "extra"}, {"id": "pineapple-souffle", "title": "Pineapple Soufflé", "time": "about 1 hr 10 min", "ingredients": ["1 large can crushed pineapple, drained", "4 slices thick bread", "4 eggs", "2 sticks butter, melted", "1 cup sugar"], "steps": ["Mix the melted butter and sugar, then add the rest.", "Bake covered at 325° for 45 minutes.", "Uncover and bake 15 minutes more."], "note": "Handwritten family recipe. The card says \"2 sticks of melted\" — butter is the likely word.", "course": "side"}, {"id": "pina-colada-cake", "title": "Piña Colada Cake", "time": "", "ingredients": ["1 package yellow cake mix", "1 can (8 oz) crushed pineapple in juice", "½ cup shredded coconut", "2 teaspoons rum flavoring", "1 carton (8 oz) frozen whipped topping", "Toasted coconut, for the top"], "steps": ["Prepare the cake mix as directed on the box, but substitute the pineapple for the water.", "Stir the shredded coconut and rum flavoring into the batter.", "Bake at 350°.", "Cool the layers for 10 minutes.", "Remove from the pans and cool completely.", "Frost the layers with whipped topping.", "Top with toasted coconut.", "Refrigerate until serving time."], "note": "Use Betty Crocker's Super Moist cake mix.", "course": "dessert"}, {"id": "portuguese-baked-beans-with-chourico", "title": "Portuguese Baked Beans with Chouriço", "time": "", "ingredients": ["1 lb white pea beans", "2 tbsp Crisco", "1 small onion, chopped", "2 garlic cloves, chopped and crushed", "2½ tsp salt", "1 can tomato paste", "½ tsp white pepper", "¼ lb salt pork, cubed", "1 lb chouriço, cut small", "Cinnamon"], "steps": ["Soak the beans overnight. Drain the water and fill with fresh water, covering the beans to the top. Cook until the beans are almost done and remove from the stove.", "Drain and refill with fresh water to cover the beans.", "Add the Crisco, pork, onion, garlic, salt, tomato paste, and pepper.", "Allow to cook until it boils.", "Remove from the fire and put in a baking dish.", "Cover with a dust of cinnamon.", "Add the chouriço.", "Place in the oven and stir occasionally.", "Bake at 350° until done."], "note": "", "course": "side", "pt": 1}, {"id": "portuguese-kale-soup", "title": "Portuguese Kale Soup", "time": "", "ingredients": ["Beef shank", "4 soup bones, salted", "Kale, chopped", "Cabbage, chopped", "4 potatoes, cubed", "Chouriço", "½ cup macaroni", "1 can red kidney beans", "Onion", "Salt and pepper", "2 chicken or beef cubes"], "steps": ["Place the beef shank in a big pot and boil for 30 minutes. Take the shank out of the pot and chop the meat in pieces.", "Place it back in the pot with the salted bones and chouriço, and cook with the onion.", "Next, place the chopped kale and cabbage in the pot.", "Add the cubes and a little salt and pepper.", "When everything is almost cooked, add the cubed potatoes.", "Add the kidney beans and macaroni and stir.", "Poke the chouriço to add flavor."], "note": "Poke the chouriço to add flavor.", "course": "soup", "pt": 1}, {"id": "portuguese-linguica-muffins", "title": "Portuguese Linguiça Muffins", "time": "", "ingredients": ["1 package (8 oz) Jiffy corn muffin mix", "1 lb ground linguiça", "1 small onion, sliced", "1 egg", "½ cup milk", "½ tsp garlic powder", "½ small green pepper, diced", "Salt and pepper, to taste", "Butter, for brushing"], "steps": ["Preheat to 350°.", "Grease a 12 cup muffin tin.", "Mix all the ingredients in a large bowl. The batter will be a little lumpy.", "Fill each muffin cup halfway.", "Bake 25 minutes, or until golden brown.", "Remove from the oven and brush the tops with butter."], "note": "", "course": "side", "pt": 1}, {"id": "portuguese-steak", "title": "Portuguese Steak", "time": "", "ingredients": ["2 lbs top round steak, cut into ½ lb servings", "2 hot red finger peppers", "8 cloves garlic, crushed", "4 eggs", "½ cup canned beef gravy", "Hot crushed pepper", "Garlic powder", "4 tbsp margarine", "Rice or fries, for serving"], "steps": ["Rub the steaks with garlic powder and hot crushed pepper. Melt 2 tbsp margarine in a fry pan and sauté the crushed garlic.", "Fry the steak 5 minutes on each side and transfer to a platter. Fry the eggs and place on top of the steaks.", "Cut the peppers, removing the seeds, and fry. Place on top of the eggs.", "Add 2 tbsp more margarine to the saucepan and ½ cup of beef gravy.", "Heat, stirring to loosen the pan drippings.", "Pour over the steaks and serve with rice or fries."], "note": "Serves 4.", "course": "dinner", "pt": 1}, {"id": "pudding-shots", "title": "Pudding Shots", "time": "", "ingredients": ["1 package chocolate instant pudding", "1 cup milk", "½ cup Bailey's Irish Cream", "½ cup Godiva chocolate liqueur", "1 container (8 oz) Cool Whip"], "steps": ["Mix all the ingredients well in a large bowl.", "Spoon into disposable shot glasses and cover.", "Freeze overnight."], "note": "Makes about 40 shots.", "course": "extra"}, {"id": "pulled-pork", "title": "Pulled Pork", "time": "", "ingredients": ["Pork chops, shoulder, etc., marinated 1 day", "BBQ sauce"], "steps": ["Wrap the pork chops, smothered in BBQ sauce, in aluminum foil and cook for about 2 hours at 300°.", "After 2 hours, break (pull) apart the pork.", "Add more BBQ sauce if dry. Maybe put back in the oven to warm up, and serve."], "note": "", "course": "dinner"}, {"id": "pumpkin-bread", "title": "Pumpkin Bread", "time": "About 1 hour", "ingredients": ["2 cups sugar", "¾ cup vegetable oil", "4 eggs", "16 oz canned pumpkin (Libby's)", "3½ cups flour", "1½ tsp salt", "2 tsp baking soda", "1 tsp nutmeg", "1 tsp cinnamon", "1 tsp allspice", "⅔ cup water"], "steps": ["Heat the oven to 350°.", "Grease the pans.", "Stir the sugar and oil.", "Stir in the eggs and pumpkin.", "Combine the dry ingredients in a separate bowl and stir.", "Blend both mixtures together.", "Divide the batter between 2 loaf pans.", "Put in the oven for 45min - 1 hour."], "note": "Makes 2 loaves in two 9x5 pans.", "course": "dessert"}, {"id": "rice-krispy-treats", "title": "Rice Krispy Treats", "time": "", "ingredients": ["5 cups Rice Krispies", "¼ cup butter", "4 cups mini marshmallows", "M&Ms, etc. (optional)"], "steps": ["Place 5 cups of Rice Krispies in a large bowl and set aside.", "In a pan, melt ¼ cup of butter over low heat.", "When the butter has melted, add 4 cups mini marshmallows.", "Continue stirring until the mixture is smooth.", "Pour the mixture over the Rice Krispies. Stir until completely coated.", "Add M&Ms, etc.", "Transfer to a lightly greased 8x8 pan.", "Use wax paper to press everything down evenly.", "Once cooled, serve!"], "note": "", "course": "dessert"}, {"id": "russian-tea", "title": "Russian Tea", "time": "5 min", "ingredients": ["2 cups Tang", "1 cup sugar", "1 tsp cinnamon", "½ cup instant tea", "1 package Lemon Twist (lemonade mix)", "1 tsp ground cloves"], "steps": ["Mix everything and store in a covered container.", "To serve, put 1–2 tsp in a cup and add boiling water."], "note": "Handwritten family recipe. A dry mix to keep on hand.", "course": "extra"}, {"id": "sausage-stuffed-portobello-mushrooms", "title": "Sausage Stuffed Portobello Mushrooms", "time": "40 min", "ingredients": ["6–8 large portobello mushrooms", "1 lb country sausage (such as Tennessee Pride)", "½ small onion, chopped", "2 cloves garlic, minced", "8 oz cream cheese", "1 egg yolk", "2 tbsp fresh sage, chopped", "2 tbsp parsley, chopped", "¼ cup Italian breadcrumbs", "3 tbsp grated Parmesan cheese"], "steps": ["Preheat the oven to 400°.", "Remove the mushroom stems and scrape out the gills. Chop the stems and add them to a skillet with the sausage and onion. Sauté until the sausage is cooked through and the onion and stems are tender. Add the garlic and cook 2 more minutes.", "In a large bowl, stir the cream cheese, breadcrumbs, herbs, and egg yolk together with the sausage mixture from the skillet.", "Scoop the filling onto the portobello caps and top with the Parmesan.", "Bake 25 minutes, until heated through and the tops are browning.", "Let cool 5 minutes and serve."], "note": "Serves 6, about 419 calories each. From Fox Valley Foodie.", "course": "dinner"}, {"id": "seafood-stew-with-rice", "title": "Seafood Stew with Rice", "time": "", "ingredients": ["Mixed seafood: crab, scrod, shrimp, scallops, little necks", "Garlic", "Pepper", "Wine", "Red hot sauce", "Butter", "Lemon or lemon juice", "Goya packet", "Onion", "Creme de marisco (envelope)", "All spice", "Cooked rice"], "steps": ["Cook the crab and put aside.", "Make the sauce and add the crab, then the cooked rice with the mixed seafood.", "Stir together.", "Let sit to acquire taste."], "note": "", "course": "soup", "pt": 1}, {"id": "shrimp-scampi", "title": "Shrimp Scampi", "time": "", "ingredients": ["Pasta", "Salt", "4 tbsp butter", "2 tbsp olive oil", "Shrimp", "1 tbsp garlic (or more)", "1 tsp salt", "½ tsp red pepper", "½ cup white wine", "1 tbsp lemon juice", "1 tsp Italian seasoning", "Parmesan cheese", "Parsley"], "steps": ["Boil the pasta and add a little salt.", "Melt 4 tbsp butter and 2 tbsp olive oil.", "Add the shrimp, 1 tbsp of garlic (or more), 1 tsp salt, and ½ tsp red pepper on medium-high.", "When pink, pour in ½ cup white wine, 1 tbsp lemon juice, and 1 tsp Italian seasoning. Let simmer 5 minutes.", "Add the pasta, Parmesan cheese, and parsley."], "note": "", "course": "dinner"}, {"id": "skillet-chicken-pot-pie", "title": "Skillet Chicken Pot Pie", "time": "45 min", "ingredients": ["4 cups cooked chicken, diced or shredded (or leftover turkey)", "1 tbsp olive oil", "½ cup onion, diced", "½ cup celery, diced", "¾ lb small red potatoes, diced, skin on", "1 tsp salt", "½ tsp pepper", "1 cup frozen peas and carrots", "2 tbsp butter", "3 tbsp flour", "2 cups chicken broth", "1 tbsp fresh thyme, chopped", "½ cup heavy cream", "1 box (6 oz) cornbread stuffing mix", "¼ cup butter (for the stuffing)"], "steps": ["Preheat the oven to 400°.", "Heat the olive oil in a 12 inch cast iron or oven-safe skillet. Add the onion, celery, potatoes, salt, and pepper and stir. Cook over medium heat 10 minutes, then cover and steam 5–10 minutes more until the potatoes are tender. Stir in the peas and carrots.", "Uncover, add the butter to melt, sprinkle in the flour, and cook 1 minute, stirring.", "Slowly whisk in the chicken broth to thicken the sauce. Bring to a boil, then lower to a simmer. Stir in the thyme, cream, and chicken.", "Make the stuffing according to the package. Spoon it over the filling in an even layer and bake 20 minutes, until browned on top and bubbling."], "note": "Serves 6. Per serving: 406 calories, 30g protein, 24g carbs, 3g fiber, 1,714mg sodium. From Mantitlement.", "course": "dinner"}, {"id": "slow-cooker-beef-short-ribs", "title": "Slow Cooker Beef Short Ribs", "time": "8 hrs 15 min", "ingredients": ["2 lbs beef short ribs (about 8, boneless or bone-in)", "½ tsp salt", "½ tsp black pepper", "1½ cups beef broth", "⅛ cup Worcestershire sauce", "½ tsp garlic powder", "½ tsp onion powder", "½ sprig fresh rosemary"], "steps": ["Season the short ribs on all sides with the salt and pepper.", "Heat a large skillet over high heat. Sear the ribs about 60 seconds per side, browning all four sides. Work in batches so the pan isn't crowded.", "In the slow cooker, whisk the beef broth, Worcestershire, garlic powder, and onion powder.", "Add the seared ribs so they're mostly submerged. Lay the rosemary on top.", "Cover and cook on LOW 6–8 hours, until the meat is fork-tender and pulls apart.", "Remove the rosemary before serving."], "note": "Serves 2. From The Stay at Home Chef.", "course": "dinner"}, {"id": "slow-cooker-jalapeno-beef", "title": "Slow Cooker Jalapeño Beef", "time": "", "ingredients": ["Beef chuck roast", "½ cup beef broth", "½ cup Worcestershire sauce", "1 tsp salt", "½ tsp pepper", "1 small onion", "Red bell pepper (1 small or ½ large)", "2 or 3 jalapeños"], "steps": ["Put the beef chuck roast on the bottom of the slow cooker.", "Add ½ cup beef broth, ½ cup Worcestershire sauce, 1 tsp salt, and ½ tsp pepper.", "Add a small onion, red bell pepper (1 small or ½ large), and 2 or 3 jalapeños.", "Cook on low for 8 hours and pull apart."], "note": "For tacos, etc.", "course": "dinner"}, {"id": "strawberry-chipotle-bbq-pulled-pork", "title": "Slow Cooker Strawberry-Chipotle BBQ Pulled Pork", "time": "", "ingredients": ["Pork", "2 tbsp olive oil", "1 sweet onion", "2 cloves garlic", "2 cups strawberries, cut", "3 chipotle chiles in adobo sauce", "1 cup ketchup", "⅔ cup brown sugar", "1 tbsp Worcestershire sauce", "2 tsp mustard", "½ tsp black pepper"], "steps": ["Heat 2 tbsp olive oil in a large saucepan over medium-high heat. Add 1 sweet onion and sauté about 5 minutes.", "Add 2 cloves garlic for about 1 minute.", "Add 2 cups cut strawberries, 3 chipotle chiles in adobo sauce, 1 cup ketchup, ⅔ cup brown sugar, 1 tbsp Worcestershire sauce, 2 tsp mustard, and ½ tsp black pepper, and bring to a boil.", "Once boiling, put in a blender or food processor.", "Put the pork in the slow cooker and pour the sauce over.", "Cook on low for 8 hours."], "note": "", "course": "dinner"}, {"id": "slow-cooker-sweet-pork", "title": "Slow Cooker Sweet Pork", "time": "", "ingredients": ["Pork butt", "2 tbsp minced garlic", "2 tbsp salt", "1 tbsp pepper", "16 oz salsa", "1 cup brown sugar", "1 tbsp cumin"], "steps": ["Place the pork butt into the slow cooker. Rub 2 tbsp minced garlic, 2 tbsp salt, and 1 tbsp pepper all over.", "Place the lid on and cook on low for 6 hours.", "After 6 hours, drain ½ of the grease and juices.", "Pour the sweet salsa mixture onto the pork (16 oz salsa, 1 cup brown sugar, 1 tbsp cumin). Cook another 1–2 hours, until the pork shreds easily."], "note": "", "course": "dinner"}, {"id": "snickerdoodles", "title": "Snickerdoodles", "time": "about 1 hr with chilling", "ingredients": ["2¾ cups sifted flour", "2 tsp cream of tartar", "1 tsp baking soda", "½ tsp salt", "1 cup shortening", "1½ cups sugar", "2 eggs", "¾ cup raisins", "2 tbsp sugar (for rolling)", "2 tsp cinnamon (for rolling)"], "steps": ["Have all ingredients at room temperature.", "Sift together the flour, cream of tartar, baking soda, and salt.", "In a mixing bowl, cream the shortening, 1½ cups sugar, and eggs at medium speed until fluffy.", "Add the sifted dry ingredients and the raisins. Mix at medium speed until completely combined.", "Chill the dough. Preheat the oven to 400°.", "Roll the dough into 1 inch balls, then roll them in the 2 tbsp sugar mixed with the cinnamon.", "Place about 2 inches apart on an ungreased baking sheet.", "Bake 8–10 minutes, until lightly browned but still soft."], "note": "Makes 5 dozen cookies. This family version has raisins. The original says to mix with a Hamilton Beach Mixette.", "course": "dessert"}, {"id": "snickers-cheesecake", "title": "Snickers Cheesecake", "time": "", "ingredients": ["Brownie crust", "1 block cream cheese", "Melted caramel", "1 container Cool Whip", "Snickers pieces"], "steps": ["Make the brownie crust.", "Beat the cream cheese block with melted caramel (don't melt the cream cheese).", "Add most of the Cool Whip container and the Snickers pieces.", "Pour over the crust.", "Put Cool Whip on top.", "Chill."], "note": "Don't melt the cream cheese.", "course": "dessert"}, {"id": "soft-peanut-butter-cornmeal-balls", "title": "Soft Peanut Butter Cornmeal Balls", "time": "", "ingredients": ["1 cup water or milk", "½ cup cornmeal", "¼ cup peanut butter", "Cinnamon, syrup, etc. (optional)"], "steps": ["Bring 1 cup of water or milk to a simmer.", "Whisk in ½ cup cornmeal for 5 minutes on low heat, until thick.", "Remove from the heat and stir in ¼ cup peanut butter.", "Optional: add cinnamon, syrup, etc.", "Let cool and roll into balls."], "note": "", "course": "dessert"}, {"id": "spicy-chickpea-chili", "title": "Spicy Chickpea Chili", "time": "", "ingredients": ["Olive oil", "1½ cups chopped mushrooms", "1 cup chopped onion", "1 cup chopped zucchini", "14.5 oz crushed tomatoes", "14.5 oz diced tomatoes with green chili, not drained", "1 cup chickpeas", "1 cup beans of choice", "2 tsp chopped garlic", "1½ tsp chili powder", "1 tsp cumin"], "steps": ["Heat olive oil in a large pot over medium-high heat.", "Add 1½ cups chopped mushrooms, 1 cup chopped onion, and 1 cup chopped zucchini. Cook about 7 minutes.", "Add 14.5 oz crushed tomatoes, 14.5 oz diced tomatoes with green chili (not drained), 1 cup chickpeas, 1 cup beans of choice, 2 tsp chopped garlic, 1½ tsp chili powder, and 1 tsp cumin.", "Cook about 4 minutes."], "note": "", "course": "soup"}, {"id": "spinach-souffle", "title": "Spinach Soufflé", "time": "about 20 min", "ingredients": ["1 package frozen spinach", "1 egg", "2 tbsp mayonnaise", "Dash of butter"], "steps": ["Thaw the spinach and drain.", "Separate the egg. Stir the yolk with the mayonnaise and blend with the spinach.", "Beat the egg white until stiff and fold it in with a dash of butter.", "Bake at 350° until it rises, about 10 minutes."], "note": "Handwritten family recipe. See also Grandmother's Spinach Soufflé.", "course": "side"}, {"id": "steak-tamale-stew", "title": "Steak Tamale Stew", "time": "", "ingredients": ["Olive oil", "Steak", "1 cup chopped onion", "1 tbsp chili powder", "2 tsp cumin", "Dash of salt and pepper", "14.5 oz diced tomatoes with green chiles, not drained", "1 cup tomato soup", "1 cup corn"], "steps": ["Bring a large pot to medium-high heat with olive oil.", "Add the steak, 1 cup chopped onion, 1 tbsp chili powder, 2 tsp cumin, and a dash of salt and pepper. Cook about 3 minutes.", "Add 14.5 oz diced tomatoes with green chiles (not drained), 1 cup tomato soup, and 1 cup corn.", "Raise the heat to high and cook about 2 minutes."], "note": "", "course": "soup"}, {"id": "steak-teriyaki-stir-fry", "title": "Steak Teriyaki Stir Fry", "time": "", "ingredients": ["Broccoli", "Peppers", "Sugar snap peas", "2 tbsp water", "Steak", "About 2 tbsp teriyaki sauce", "1 tbsp soy sauce", "1 tbsp chopped garlic"], "steps": ["Heat a large skillet over medium-high heat. Add broccoli, peppers, sugar snap peas, and 2 tbsp water. Cover and cook until thawed.", "Add the steak and cook about 4 minutes.", "Stir in teriyaki sauce (about 2 tbsp), 1 tbsp soy sauce, and 1 tbsp chopped garlic."], "note": "", "course": "dinner"}, {"id": "steakhouse-spinach-salad", "title": "Steakhouse Spinach Salad", "time": "", "ingredients": ["Spinach", "Tomatoes", "Steak", "⅓ cup chopped onion", "Dash of salt and pepper", "Blue cheese", "Bacon"], "steps": ["Place the spinach in a large bowl. Top with tomatoes.", "Heat a skillet over medium-high heat. Add the steak, ⅓ cup chopped onion, and a dash of salt and pepper. Cook about 3 minutes.", "Top with blue cheese and     var addBtn = h('button', { className: 'btn small', type: 'button', text: 'Add to this week', on: { click: function () {
      var v = sel.value, label = sel.options[sel.selectedIndex].text;
      if (v === 'dessert') S.week.dessert = r.id;
      else { var p = v.split(':'); S.week[p[0]] = S.week[p[0]] || {}; S.week[p[0]][p[1]] = r.id; }
      touched();
      toast.textContent = 'Added for ' + label + '.'; toast.hidden = false;
    } } });

    var wakeBtn = null;
    if ('wakeLock' in navigator) {
      wakeBtn = h('button', { className: 'link', type: 'button', text: wake ? 'Screen stays on' : 'Keep screen on' });
      wakeBtn.addEventListener('click', function () {
        if (wake) { releaseWake(); wakeBtn.textContent = 'Keep screen on'; return; }
        try { navigator.wakeLock.request('screen').then(function (w) { wake = w; wakeBtn.textContent = 'Screen stays on'; })
          .catch(function () { wakeBtn.textContent = 'Screen lock not available here'; wakeBtn.disabled = true; }); }
        catch (e) { wakeBtn.textContent = 'Screen lock not available here'; wakeBtn.disabled = true; }
      });
    }
    app.append(
      h('div', { className: 'top' }, [h('a', { className: 'link', href: S.back || '#', text: S.back === '#week' ? '‹ This week' : S.back === '#balance' ? '‹ Nutrition check' : '‹ All recipes' }), wakeBtn]),
      h('article', { className: 'sheet recipe' }, [
        ART.el(r, 'recipe-art'),
        h('header', {}, [h('h1', {}, [h('span', { className: 'mark', text: r.title })]), h('p', { className: 'tags', text: metaOf(r) })]),
        h('section', { className: 'block' }, [h('h3', { className: 'label', text: 'Ingredients' }), ing]),
        h('section', { className: 'block' }, [h('h3', { className: 'label', text: 'Directions' }), steps,
          h('p', { className: 'hint', text: 'Tap an ingredient or a step to cross it off as you go.' })]),
        r.note ? h('section', { className: 'block' }, [h('h3', { className: 'label', text: 'Note' }), h('p', { className: 'note', text: r.note })]) : null,
        h('section', { className: 'block' }, [h('h3', { className: 'label', text: 'Put it on the menu' }),
          h('div', { className: 'addbox' }, [sel, addBtn]), toast])
      ])
    );
  }

  /* ---- this week ---- */
  function pickerEl(day, slot) {
    var wantCourse = slot === 'side' ? ['side', 'extra'] : slot === 'dessert' ? ['dessert'] : ['dinner', 'soup'];
    var showAll = false;
    var box = h('div', { className: 'picker' });
    var input = h('input', { className: 'search', id: 'pick-q', type: 'search', placeholder: 'Search recipes', value: S.pq, 'aria-label': 'Search recipes to choose' });
    var list = h('div', { className: 'list', id: 'pick-list' });
    var allBtn = h('button', { className: 'link', type: 'button', text: 'Show every recipe' });
    function fill() {
      var q = S.pq.trim().toLowerCase();
      var opts = RECIPES.filter(function (r) { return (showAll || wantCourse.indexOf(r.course) !== -1) && (!q || r.title.toLowerCase().indexOf(q) !== -1); });
      list.replaceChildren();
      if (!opts.length) list.appendChild(h('p', { className: 'empty', text: 'Nothing matches “' + S.pq.trim() + '”.' }));
      opts.forEach(function (r) {
        list.appendChild(h('button', { className: 'opt', type: 'button', text: r.title, on: { click: function () { set(day, slot, r.id); } } }));
      });
    }
    input.addEventListener('input', function (e) { S.pq = e.target.value; fill(); });
    allBtn.addEventListener('click', function () { showAll = !showAll; allBtn.textContent = showAll ? 'Show only ' + (slot === 'main' ? 'dinners' : slot + 's') : 'Show every recipe'; fill(); });
    fill();
    box.append(input, list, h('div', { className: 'top' }, [allBtn,
      h('button', { className: 'link', type: 'button', text: 'Cancel', on: { click: function () { S.picking = null; render(); } } })]));
    setTimeout(function () { try { input.focus({ preventScroll: true }); } catch (e) {} }, 0);
    return box;
  }
  function set(day, slot, id) {
    if (slot === 'dessert') S.week.dessert = id;
    else { S.week[day] = S.week[day] || {}; S.week[day][slot] = id; }
    S.picking = null; S.pq = ''; touched(); render();
  }
  function slotEl(day, slot, id) {
    var r = id && BY[id];
    var open = S.picking && S.picking[0] === day && S.picking[1] === slot;
    var wrap = h('div', {});
    wrap.appendChild(h('div', { className: 'slot' }, [
      h('span', { className: 'k', text: slot === 'dessert' ? 'Sweet' : slot }),
      r ? h('a', { className: 'dish', href: '#r-' + r.id, text: r.title, on: { click: function () { S.back = '#week'; } } })
        : h('button', { className: 'dish none', type: 'button', text: slot === 'side' ? 'No side' : 'Nothing planned', on: { click: function () { S.picking = [day, slot]; S.pq = ''; render(); } } }),
      h('button', { className: 'x', type: 'button', text: r ? 'Swap' : 'Choose', 'aria-label': (r ? 'Swap ' : 'Choose ') + slot + (day ? ' for ' + day : ''), on: { click: function () {
        S.picking = open ? null : [day, slot]; S.pq = ''; render();
      } } }),
      r ? h('button', { className: 'x', type: 'button', text: 'Clear', 'aria-label': 'Clear ' + slot, on: { click: function () { set(day, slot, null); } } }) : null
    ]));
    if (open) wrap.appendChild(pickerEl(day, slot));
    return wrap;
  }
  function shuffle() {
    function pool(cs) { return RECIPES.filter(function (r) { return cs.indexOf(r.course) !== -1 && r.steps.length > 1; }).map(function (r) { return r.id; }); }
    function draw(arr) { var i = Math.floor(Math.random() * arr.length); return arr.splice(i, 1)[0]; }
    var mains = pool(['dinner', 'soup']), sides = pool(['side']), sweets = pool(['dessert']);
    var w = {};
    DAYS.forEach(function (d, i) { w[d[0]] = { main: draw(mains), side: i % 2 === 0 ? draw(sides) : null }; });
    w.dessert = draw(sweets);
    S.week = w; S.picking = null; touched(); render();
  }
  function renderWeek() {
    var days = DAYS.map(function (d) {
      var w = S.week[d[0]] || {};
      return h('div', { className: 'day' }, [
        h('div', { className: 'dname', text: d[2] }),
        h('div', { className: 'slots' }, [slotEl(d[0], 'main', w.main), slotEl(d[0], 'side', w.side)])
      ]);
    });
    app.append(
      h('header', { className: 'cover' }, [
        h('h1', { text: 'This week’s menu' }),
        h('p', { text: S.suggested ? 'A suggested week to start from. Swap anything, or shuffle for a new one.' : 'Tap a dish to open it. Your menu is saved in this browser.' })
      ]),
      h('section', { className: 'sheet' }, [h('div', {}, days)]),
      h('section', { className: 'sheet' }, [h('h3', { className: 'label', text: 'Dessert of the week' }), slotEl(null, 'dessert', S.week.dessert)]),
      (function () { var x = analyze(); if (!x.nights.length) return null; var short = x.res.filter(function (y) { return y.status === 'low'; }).map(function (y) { return y.n.name.toLowerCase(); });
        return h('section', { className: 'sheet' }, [h('h3', { className: 'label', text: 'Nutrition at a glance' }), h('p', { style: 'margin:0', text: short.length ? 'Short on ' + short.join(', ') + ' this week.' : 'No big gaps this week.' }), h('a', { className: 'link', href: '#balance', text: 'See the nutrition check ›', style: 'padding:0' })]); })(),
      h('div', { className: 'row2' }, [
        h('button', { className: 'btn ghost', type: 'button', text: 'Shuffle the week', on: { click: shuffle } }),
        h('a', { className: 'btn', href: '#shop', style: 'display:flex;align-items:center;justify-content:center;text-decoration:none', text: 'Shopping list' })
      ])
    );
  }

  /* ---- shopping list ---- */
  function renderShop() {
    var recipes = weekIds().map(function (id) { return BY[id]; });
    app.append(h('header', { className: 'cover' }, [h('h1', { text: 'Shopping list' }), h('p', { id: 'shop-count' })]));
    var count = app.querySelector('#shop-count');
    if (!recipes.length) {
      count.textContent = 'Nothing on this week’s menu yet.';
      app.appendChild(h('section', { className: 'sheet' }, [h('p', { className: 'empty', text: 'Add dishes to This week and their ingredients show up here, combined into one list.' }),
        h('a', { className: 'link', href: '#week', text: 'Plan this week ›' })]));
      return;
    }
    var items = compile(recipes);
    function sync() {
      var got = items.filter(function (it) { return S.shopChecked[it.key]; }).length;
      count.textContent = got + ' of ' + plural(items.length, 'item') + ' in the cart';
    }
    var rows = h('ul', { className: 'rows' }, items.map(function (it, i) {
      var li = h('li', { className: S.shopChecked[it.key] ? 'done' : '' });
      var box = h('input', { type: 'checkbox', id: 'shop-' + i, checked: !!S.shopChecked[it.key], on: { change: function () {
        S.shopChecked[it.key] = box.checked; li.className = box.checked ? 'done' : ''; sync(); save();
      } } });
      li.appendChild(h('label', { 'for': 'shop-' + i }, [box, h('span', { className: 'txt' }, [
        h('strong', { text: it.name }), it.amount ? h('span', { className: 'amt', text: '  ' + it.amount }) : null,
        h('span', { className: 'from', text: it.from.join(', ') })
      ])]));
      return li;
    }));
    var fallback = h('textarea', { id: 'copy-fallback', readOnly: true, hidden: true, 'aria-label': 'Shopping list text' });
    var copyBtn = h('button', { className: 'btn', type: 'button', text: 'Copy list' });
    copyBtn.addEventListener('click', function () {
      var text = 'Shopping list\n\n' + items.filter(function (it) { return !S.shopChecked[it.key]; })
        .map(function (it) { return '- ' + it.name + (it.amount ? ': ' + it.amount : ''); }).join('\n');
      function manual() { fallback.value = text; fallback.hidden = false; fallback.focus(); fallback.select(); copyBtn.textContent = 'Select and copy below'; }
      try { navigator.clipboard.writeText(text).then(function () { copyBtn.textContent = 'Copied'; }).catch(manual); } catch (e) { manual(); }
    });
    sync();
    app.append(
      h('section', { className: 'sheet' }, [
        h('div', { className: 'block' }, [h('h3', { className: 'label', text: 'For ' + plural(recipes.length, 'dish') }),
          h('p', { className: 'hint', text: recipes.map(function (r) { return r.title; }).join(', ') })]),
        rows,
        h('p', { className: 'hint', text: 'Like ingredients are combined into one amount. Copy list leaves out what you have already checked off.' }),
        fallback
      ]),
      h('div', { className: 'row2' }, [
        h('a', { className: 'btn ghost', href: '#week', style: 'display:flex;align-items:center;justify-content:center;text-decoration:none', text: 'Change the menu' }),
        copyBtn
      ])
    );
  }

  /* ---- routing ---- */
  function route() { return (location.hash || '').replace(/^#/, ''); }
  function render() {
    var r = route(), view = r.indexOf('r-') === 0 ? 'recipe' : r === 'week' ? 'week' : r === 'shop' ? 'shop' : r === 'balance' ? 'balance' : 'list';
    if (view !== 'recipe') releaseWake();
    app.replaceChildren();
    ['recipes', 'week', 'shop', 'balance'].forEach(function (t) { document.getElementById('t-' + t).removeAttribute('aria-current'); });
    document.getElementById('t-' + (view === 'recipe' || view === 'list' ? 'recipes' : view)).setAttribute('aria-current', 'page');
    if (view === 'recipe') renderRecipe(r.slice(2)); else if (view === 'week') renderWeek(); else if (view === 'shop') renderShop(); else if (view === 'balance') renderBalance(); else renderList();
  }
  var lastView = '';
  window.addEventListener('hashchange', function () {
    var r = route();
    if (r.indexOf('r-') !== 0) S.back = r === 'week' ? '#week' : r === 'balance' ? '#balance' : '#';
    else if (lastView.indexOf('r-') !== 0 && lastView !== 'week' && lastView !== 'balance') S.back = '#';
    lastView = r; S.picking = null;
    render(); window.scrollTo(0, 0);
  });
  load(); lastView = route(); S.back = '#'; counts(); render();
})();
</script>
<script>
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
}
</script>
